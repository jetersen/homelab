name: Go checks
on:
  push:
    branches: [main]
    paths:
      - infrastructure/backup/image/**
      - .forgejo/workflows/check-go.yaml
      - .ci/actions/check-go/**
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label
        type: choice
        default: linux-host
        options: [linux-host, linux-docker, runner-rocket]
concurrency:
  group: check-go
  cancel-in-progress: false
jobs:
  check:
    name: Go tests and vet
    if: forgejo.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner || 'linux-host' }}
    timeout-minutes: 10
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.ci/actions/check-go
        with:
          directory: infrastructure/backup/image
