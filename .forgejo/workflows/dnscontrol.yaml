name: DNSControl
defaults:
  run:
    shell: bash
concurrency:
  group: dnscontrol
  cancel-in-progress: false
on:
  pull_request:
    paths: [infrastructure/dns/**, package.json, package-lock.json, biome.json, .forgejo/workflows/dnscontrol.yaml]
  push:
    branches: [main]
    paths: [infrastructure/dns/**, package.json, package-lock.json, biome.json, .forgejo/workflows/dnscontrol.yaml]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the previewed DNS changes
        type: boolean
        default: false
jobs:
  reconcile:
    runs-on: [linux-docker, runner-kubernetes]
    timeout-minutes: 5
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check JavaScript style
        run: npm run check:javascript
      - name: Test DNS credentials
        run: node --test infrastructure/dns/creds.test.mjs
      - uses: ./infrastructure/dns
        with:
          directory: ${{ runner.temp }}/dnscontrol-tools
      - name: Validate all DNS views
        run: |
          "$RUNNER_TEMP/dnscontrol-tools/dnscontrol" check --config infrastructure/dns/dnsconfig.js
      - name: Reconcile all DNS views
        if: forgejo.ref == 'refs/heads/main' && forgejo.event_name != 'pull_request' && vars.DNSCONTROL_ENABLED == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.DNSCONTROL_CF_API_TOKEN }}
          UNIFI_API_KEY: ${{ secrets.DNSCONTROL_UNIFI_API_KEY }}
          TECHNITIUM_TSIG_SECRET: ${{ secrets.DNSCONTROL_TECHNITIUM_TSIG_SECRET }}
          APPLY_DNS: ${{ forgejo.event_name == 'push' || inputs.apply }}
        run: |
          set -euo pipefail
          command=preview
          if [ "$APPLY_DNS" = true ]; then command=push; fi
          "$RUNNER_TEMP/dnscontrol-tools/dnscontrol" "$command" \
            --config infrastructure/dns/dnsconfig.js \
            --creds "!$PWD/infrastructure/dns/creds.mjs" --no-populate
