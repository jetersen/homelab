name: Publish Flux OCI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label
        type: choice
        default: oci-build
        options: [oci-build, runner-rocket]
enable-openid-connect: true
concurrency:
  group: publish-oci
  cancel-in-progress: false
jobs:
  publish:
    if: forgejo.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner || 'oci-build' }}
    timeout-minutes: 20
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.ci/actions/setup-tool
        with:
          tool: flux
      - name: Authenticate with the package integration
        id: auth
        uses: https://github.com/actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUDIENCE: ${{ vars.OCI_PACKAGES_AUDIENCE }}
        with:
          script: |
            if (!process.env.AUDIENCE) throw new Error('Configure the Authorized Integration audience');
            core.setOutput('token', await core.getIDToken(process.env.AUDIENCE));
      - uses: https://github.com/docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: forgejo.jetersen.dev
          username: ${{ forgejo.repository_owner }}
          password: ${{ steps.auth.outputs.token }}
      - uses: ./.ci/actions/publish-oci
        with:
          registry: forgejo.jetersen.dev
          repository: ${{ forgejo.repository }}
