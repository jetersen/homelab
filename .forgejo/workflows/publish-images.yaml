name: Publish container images
on:
  push:
    branches: [main]
    paths:
      - infrastructure/backup/image/**
      - infrastructure/forgejo/runner/Dockerfile
      - infrastructure/forgejo/runner/Dockerfile.dockerignore
      - .ci/actions/publish-images/**
      - .forgejo/workflows/publish-images.yaml
      - .github/workflows/publish-images.yaml
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label
        type: choice
        default: oci-build
        options: [oci-build, runner-kubernetes, runner-rocket]
enable-openid-connect: true
concurrency:
  group: publish-images
  cancel-in-progress: false
jobs:
  publish:
    if: forgejo.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner || 'oci-build' }}
    timeout-minutes: 20
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate with the package integration
        id: auth
        shell: bash
        env:
          AUDIENCE: ${{ vars.OCI_PACKAGES_AUDIENCE }}
        run: |
          set -euo pipefail
          : "${AUDIENCE:?Configure OCI_PACKAGES_AUDIENCE for the Authorized Integration}"
          token=$(printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            | curl --fail --silent --show-error --header @- \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -er '.value')
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: ./.ci/actions/publish-images
        with:
          registry: forgejo.jetersen.dev
          username: ${{ forgejo.repository_owner }}
          token: ${{ steps.auth.outputs.token }}
          repository: ${{ forgejo.repository }}
