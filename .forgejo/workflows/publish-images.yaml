name: Publish container images
on:
  push:
    branches: [main]
    paths:
      - infrastructure/renovate/**
      - .ci/renovate-upgrade-policy.mjs
      - .ci/renovate-operator-cliff.toml
      - .ci/renovate-worker-cliff.toml
      - infrastructure/backup/image/**
      - infrastructure/forgejo/runner/Dockerfile
      - infrastructure/forgejo/runner/Dockerfile.dockerignore
      - infrastructure/dns/install.sh
      - infrastructure/dns/compat/**
      - package.json
      - package-lock.json
      - requirements-dev.txt
      - .ci/actions/publish-images/**
      - .ci/actions/setup-tool/**
      - .ci/check-runner.sh
      - .ci/backup-helper-cliff.toml
      - .ci/runner-job-cliff.toml
      - .ci/image-select.sh
      - .ci/image-inputs.sh
      - .ci/image-release.sh
      - .ci/publish-image.sh
      - .ci/image-publishing.test.mjs
      - .ci/image-retention.mjs
      - .ci/image-retention.test.mjs
      - .forgejo/workflows/publish-images.yaml
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label
        type: choice
        default: linux-docker
        options: [linux-docker, runner-rocket]
enable-openid-connect: true
concurrency:
  group: publish-images
  cancel-in-progress: false
jobs:
  publish:
    if: forgejo.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner || 'linux-docker' }}
    timeout-minutes: 35
    steps:
      - name: Authenticate release tags
        id: release
        uses: https://github.com/actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUDIENCE: ${{ vars.IMAGE_RELEASE_AUDIENCE }}
        with:
          script: |
            if (!process.env.AUDIENCE) throw new Error('Configure the Authorized Integration audience');
            core.setOutput('token', await core.getIDToken(process.env.AUDIENCE));
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.release.outputs.token }}
      - uses: ./.ci/actions/setup-tool
        with:
          tool: git-cliff
      - name: Test image publication
        run: node --test .ci/image-publishing.test.mjs .ci/image-retention.test.mjs
      - name: Allocate changed image releases
        shell: bash
        env:
          BEFORE: ${{ forgejo.event.before }}
          EVENT_NAME: ${{ forgejo.event_name }}
        run: |
          set -euo pipefail
          while IFS= read -r component; do
            bash .ci/image-release.sh "$component"
          done < <(bash .ci/image-select.sh)
      - name: Authenticate with the package integration
        id: auth
        uses: https://github.com/actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUDIENCE: ${{ vars.OCI_PACKAGES_AUDIENCE }}
        with:
          script: |
            if (!process.env.AUDIENCE) throw new Error('Configure the Authorized Integration audience');
            core.setOutput('token', await core.getIDToken(process.env.AUDIENCE));
      - uses: https://github.com/docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: forgejo.jetersen.dev
          username: ${{ forgejo.repository_owner }}
          password: ${{ steps.auth.outputs.token }}
      - uses: ./.ci/actions/publish-images
        with:
          registry: forgejo.jetersen.dev
          repository: ${{ forgejo.repository }}
      - name: Retain workload image releases
        if: env.BACKUP_HELPER_VERSION != '' || env.RUNNER_JOB_VERSION != ''
        env:
          FORGEJO_HOST: https://forgejo.jetersen.dev
          FORGEJO_OWNER: ${{ forgejo.repository_owner }}
          FORGEJO_REPOSITORY: ${{ forgejo.event.repository.name }}
          FORGEJO_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # Publication can finish after another PR merges. Plan cleanup from the
          # latest pins; retention still refuses any subsequent head change.
          git fetch --no-tags origin refs/heads/main
          git checkout --detach FETCH_HEAD
          node .ci/image-retention.mjs --apply
