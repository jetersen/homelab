name: Code style (javascript)
on:
  push:
    branches: [main]
    paths: ['**/*.js', '**/*.mjs', '**/*.cjs', 'biome.json', '.ci/actions/setup-tool/check.sh', '.editorconfig', '.forgejo/workflows/check-style-javascript.yaml']
  pull_request:
    paths: ['**/*.js', '**/*.mjs', '**/*.cjs', 'biome.json', '.ci/actions/setup-tool/check.sh', '.editorconfig', '.forgejo/workflows/check-style-javascript.yaml']
  workflow_dispatch:
concurrency:
  group: code-style-javascript-${{ forgejo.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    runs-on: linux-docker
    timeout-minutes: 5
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm run check:javascript
      - run: node --test .ci/setup-tool.test.mjs infrastructure/dns/creds.test.mjs
