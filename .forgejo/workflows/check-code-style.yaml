name: Code style
on:
  push:
    paths: ['**/*.js', '**/*.mjs', '**/*.cjs', '**/*.cs', '**/*.py', '**/*.csproj', '**/*.go', '**/go.mod', '**/go.sum', '**/global.json', '**/packages.lock.json', 'infrastructure/dns/**', '.ci/actions/**', 'package*.json', 'biome.json', 'ruff.toml', '.editorconfig', 'requirements-dev.txt', '*.slnx', '.forgejo/workflows/check-code-style.yaml']
  pull_request:
    paths: ['**/*.js', '**/*.mjs', '**/*.cjs', '**/*.cs', '**/*.py', '**/*.csproj', '**/*.go', '**/go.mod', '**/go.sum', '**/global.json', '**/packages.lock.json', 'infrastructure/dns/**', '.ci/actions/**', 'package*.json', 'biome.json', 'ruff.toml', '.editorconfig', 'requirements-dev.txt', '*.slnx', '.forgejo/workflows/check-code-style.yaml']
concurrency:
  group: code-style-${{ forgejo.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    runs-on: runner-kubernetes
    timeout-minutes: 5
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm run check:javascript
      - run: node --test .ci/setup-tool.test.mjs
  python:
    runs-on: runner-kubernetes
    timeout-minutes: 5
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm run check:python
  csharp:
    runs-on: runner-kubernetes
    timeout-minutes: 10
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore projects
        run: |
          python3 infrastructure/truenas/restore-provider.py
          dotnet restore Homelab.slnx --locked-mode
      - run: npm run check:csharp
      - name: Validate C# changes
        run: |
          dotnet build infrastructure/truenas/Homelab.TrueNas.csproj --no-restore
          dotnet run --project infrastructure/backup/tests/Backup.Tests.csproj --no-restore
  dnscontrol:
    runs-on: runner-kubernetes
    timeout-minutes: 10
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.ci/actions/check-go
        with:
          directory: infrastructure/dns/compat
      - name: Check compatibility build
        run: |
          bash infrastructure/dns/install.sh "$RUNNER_TEMP/dnscontrol-tools"
          "$RUNNER_TEMP/dnscontrol-tools/dnscontrol" check --config infrastructure/dns/dnsconfig.js
