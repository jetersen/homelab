# Check jobs generated by .ci/generate-pr-checks.mjs. Edit their source workflows.
name: PR checks
on:
  pull_request: {}
concurrency:
  group: pr-checks-${{ forgejo.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: linux-docker
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.select.outputs.runner }}
      csharp: ${{ steps.select.outputs.csharp }}
      dnscontrol: ${{ steps.select.outputs.dnscontrol }}
      javascript: ${{ steps.select.outputs.javascript }}
      python: ${{ steps.select.outputs.python }}
      upgrade_policy: ${{ steps.select.outputs.upgrade_policy }}
      dns: ${{ steps.select.outputs.dns }}
      truenas: ${{ steps.select.outputs.truenas }}
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          BASE_SHA: ${{ forgejo.event.pull_request.base.sha }}
          HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
        run: python3 .ci/pr-checks.py select "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
  runner:
    runs-on: linux-docker
    timeout-minutes: 15
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and validate runner
        run: |
          image="homelab-runner:validate-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          trap 'docker image rm "$image" > /dev/null 2>&1 || true' EXIT
          docker build -f infrastructure/forgejo/runner/Dockerfile -t "$image" .
          docker run --rm -i --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            "$image" bash -s < .ci/check-runner.sh
    if: ${{ needs.changes.outputs.runner == 'true' }}
    name: Runner image
    needs:
      - changes
    concurrency:
      group: runner-image-${{ forgejo.ref }}
      cancel-in-progress: true
  csharp:
    runs-on: linux-docker
    timeout-minutes: 10
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Restore projects
        run: |
          python3 infrastructure/truenas/restore-provider.py
          dotnet restore Homelab.slnx --locked-mode
      - run: npm run check:csharp
      - name: Validate C# changes
        run: |
          dotnet build infrastructure/truenas/Homelab.TrueNas.csproj --no-restore
          dotnet run --project infrastructure/backup/tests/Backup.Tests.csproj --no-restore
    if: ${{ needs.changes.outputs.csharp == 'true' }}
    name: C# validation
    needs:
      - changes
    concurrency:
      group: code-style-csharp-${{ forgejo.ref }}
      cancel-in-progress: true
  dnscontrol:
    runs-on: linux-docker
    timeout-minutes: 10
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.ci/actions/check-go
        with:
          directory: infrastructure/dns/compat
      - name: Check compatibility build
        run: |
          bash infrastructure/dns/install.sh "$RUNNER_TEMP/dnscontrol-tools"
          "$RUNNER_TEMP/dnscontrol-tools/dnscontrol" check --config infrastructure/dns/dnsconfig.js
    if: ${{ needs.changes.outputs.dnscontrol == 'true' }}
    name: DNS compatibility
    needs:
      - changes
    concurrency:
      group: code-style-dnscontrol-${{ forgejo.ref }}
      cancel-in-progress: true
  javascript:
    runs-on: linux-docker
    timeout-minutes: 5
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npm run check:javascript
      - run: node --test .ci/setup-tool.test.mjs .ci/image-retention.test.mjs infrastructure/dns/creds.test.mjs .ci/pr-checks-gate.test.mjs
      - run: node .ci/generate-pr-checks.mjs --check
    if: ${{ needs.changes.outputs.javascript == 'true' }}
    name: JavaScript
    needs:
      - changes
    concurrency:
      group: code-style-javascript-${{ forgejo.ref }}
      cancel-in-progress: true
  python:
    runs-on: linux-docker
    timeout-minutes: 5
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm run check:python
      - run: python3 -m unittest discover -s .ci -p test_pr_checks.py
      - run: python3 -m unittest discover -s infrastructure/android-tv -p 'test_*.py'
    if: ${{ needs.changes.outputs.python == 'true' }}
    name: Python
    needs:
      - changes
    concurrency:
      group: code-style-python-${{ forgejo.ref }}
      cancel-in-progress: true
  upgrade_policy:
    runs-on: linux-docker
    timeout-minutes: 5
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node --test .ci/renovate-upgrade-policy.test.mjs infrastructure/renovate/worker/*.test.*
    if: ${{ needs.changes.outputs.upgrade_policy == 'true' }}
    name: Upgrade policy
    needs:
      - changes
  dns:
    runs-on:
      - linux-docker
      - runner-kubernetes
    timeout-minutes: 5
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - name: Check JavaScript style
        run: npm run check:javascript
      - name: Test DNS configuration and credentials
        run: node --test infrastructure/dns/*.test.mjs
      - uses: ./infrastructure/dns
        with:
          directory: ${{ runner.temp }}/dnscontrol-tools
      - name: Validate all DNS views
        run: |
          "$RUNNER_TEMP/dnscontrol-tools/dnscontrol" check --config infrastructure/dns/dnsconfig.js
    if: ${{ needs.changes.outputs.dns == 'true' }}
    name: DNS validation
    needs:
      - changes
    concurrency:
      group: dnscontrol
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
  truenas:
    if: ${{ needs.changes.outputs.truenas == 'true' && (forgejo.event_name != 'pull_request' || forgejo.event.pull_request.head.repo.full_name == forgejo.repository) }}
    runs-on: linux-docker
    timeout-minutes: 20
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: ./.ci/actions/setup-tool
        with:
          tool: pulumi
      - name: Restore and build
        run: |
          python3 infrastructure/truenas/restore-provider.py
          dotnet restore infrastructure/truenas/Homelab.TrueNas.csproj --locked-mode
          dotnet build infrastructure/truenas/Homelab.TrueNas.csproj --no-restore
      - name: Preview
        env:
          TRUENAS_HOST: ${{ vars.TRUENAS_HOST }}
          TRUENAS_TOKEN: ${{ secrets.TRUENAS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PULUMI_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PULUMI_STATE_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          pulumi -C infrastructure/truenas preview --stack homelab --refresh --non-interactive
    name: TrueNAS preview
    needs:
      - changes
    concurrency:
      group: truenas-pulumi
      cancel-in-progress: false
  complete:
    name: Required PR checks
    if: ${{ always() }}
    needs:
      - changes
      - runner
      - csharp
      - dnscontrol
      - javascript
      - python
      - upgrade_policy
      - dns
      - truenas
    runs-on: linux-docker
    timeout-minutes: 5
    steps:
      - env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'PR_CHECK_GATE'
          export function verifyChecks(results) {
            if (results.changes?.result !== "success") {
              throw new Error("PR check selection did not succeed");
            }
            const selected = results.changes.outputs;
            for (const [name, required] of Object.entries(selected)) {
              const expected = required === "true" ? "success" : "skipped";
              if (!["true", "false"].includes(required) || results[name]?.result !== expected) {
                throw new Error(`PR check ${name} did not finish as ${expected}`);
              }
            }
            if (Object.keys(results).sort().join() !== ["changes", ...Object.keys(selected)].sort().join()) {
              throw new Error("PR check results do not match selected checks");
            }
          }

          if (process.env.CHECK_RESULTS) {
            verifyChecks(JSON.parse(process.env.CHECK_RESULTS));
            console.log("Every applicable PR check passed");
          }
          PR_CHECK_GATE
