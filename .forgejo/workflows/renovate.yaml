name: Renovate
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect dependencies without writing branches or pull requests
        type: boolean
        default: false
enable-openid-connect: true
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    if: forgejo.ref == 'refs/heads/main'
    runs-on: oci-build
    container:
      image: ghcr.io/renovatebot/renovate:44.132.2@sha256:0191afbc3937e5316263426fc0ce1450f5c143d42e3f91da8c6f771e317fae51
    timeout-minutes: 45
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate with the Renovate integration
        id: auth
        uses: https://github.com/actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUDIENCE: ${{ vars.RENOVATE_AUDIENCE }}
        with:
          script: |
            if (!process.env.AUDIENCE) throw new Error('Configure the Authorized Integration audience');
            core.setOutput('token', await core.getIDToken(process.env.AUDIENCE));
      - name: Verify live upgrade compatibility
        shell: bash
        env:
          RENOVATE_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          node --test .ci/renovate-upgrade-policy.test.mjs
          node .ci/renovate-upgrade-policy.mjs "$RUNNER_TEMP/upgrade-package-rules.json"
          echo "RENOVATE_PACKAGE_RULES=$(cat "$RUNNER_TEMP/upgrade-package-rules.json")" >> "$GITHUB_ENV"
      - name: Authenticate package lookups
        id: packages
        uses: https://github.com/actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUDIENCE: ${{ vars.RENOVATE_PACKAGES_AUDIENCE }}
        with:
          script: |
            if (!process.env.AUDIENCE) throw new Error('Configure the Authorized Integration audience');
            core.setOutput('token', await core.getIDToken(process.env.AUDIENCE));
      - name: Authenticate GitHub dependency lookups
        id: github
        uses: https://github.com/actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_READ_APP_PRIVATE_KEY }}
          owner: jetersen
          repositories: homelab
          permission-metadata: read
          github-api-url: https://api.github.com
      - name: Update Forgejo dependencies
        shell: bash
        env:
          RENOVATE_TOKEN: ${{ steps.auth.outputs.token }}
          RENOVATE_GITHUB_COM_TOKEN: ${{ steps.github.outputs.token }}
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: https://forgejo.jetersen.dev/api/v1
          RENOVATE_REPOSITORIES: '["jetersen/homelab"]'
          RENOVATE_CONFIG_FILE_NAMES: '[".forgejo/renovate.json"]'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_GIT_AUTHOR: 'renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>'
          DRY_RUN: ${{ inputs.dry_run }}
          REGISTRY_USERNAME: ${{ forgejo.repository_owner }}
          REGISTRY_TOKEN: ${{ steps.packages.outputs.token }}
        run: |
          set -euo pipefail
          # Renovate has no "none" dry-run mode; normal runs must leave it unset.
          unset RENOVATE_DRY_RUN
          if [ "$DRY_RUN" = true ]; then
            export RENOVATE_DRY_RUN=full
            echo 'Renovate mode: dry run'
          else
            echo 'Renovate mode: normal'
          fi
          RENOVATE_HOST_RULES=$(jq -cn '[{
            hostType: "docker",
            matchHost: "forgejo.jetersen.dev",
            username: env.REGISTRY_USERNAME,
            password: env.REGISTRY_TOKEN
          }]')
          export RENOVATE_HOST_RULES
          # Job containers bypass the image entrypoint that initializes its tools.
          renovate-entrypoint.sh renovate
