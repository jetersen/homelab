name: TrueNAS Pulumi
on:
  pull_request:
    paths:
      - infrastructure/truenas/**
      - .forgejo/workflows/truenas.yaml
  push:
    branches: [main]
    paths:
      - infrastructure/truenas/**
      - .forgejo/workflows/truenas.yaml
  workflow_dispatch:
concurrency:
  group: truenas-pulumi
  cancel-in-progress: false
jobs:
  deploy:
    if: forgejo.event_name != 'pull_request' || forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: oci-build
    timeout-minutes: 20
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install runtime prerequisites
        run: |
          apt-get update
          apt-get install --no-install-recommends -y python3 libicu72
      - uses: https://github.com/actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: infrastructure/truenas/global.json
      - uses: https://github.com/pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: '3.267.0'
      - name: Restore and build
        run: |
          npm ci --ignore-scripts
          python3 infrastructure/truenas/restore-provider.py
          dotnet restore infrastructure/truenas/Homelab.TrueNas.csproj --locked-mode
          dotnet build infrastructure/truenas/Homelab.TrueNas.csproj --no-restore
      - name: Preview
        env:
          TRUENAS_HOST: ${{ vars.TRUENAS_HOST }}
          TRUENAS_TOKEN: ${{ secrets.TRUENAS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PULUMI_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PULUMI_STATE_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: npm exec -- varlock run --path infrastructure/truenas -- pulumi -C infrastructure/truenas preview --stack homelab --refresh --non-interactive
      - name: Apply
        if: forgejo.ref == 'refs/heads/main' && forgejo.event_name != 'pull_request'
        env:
          TRUENAS_HOST: ${{ vars.TRUENAS_HOST }}
          TRUENAS_TOKEN: ${{ secrets.TRUENAS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PULUMI_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PULUMI_STATE_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: npm exec -- varlock run --path infrastructure/truenas -- pulumi -C infrastructure/truenas up --stack homelab --refresh --yes --non-interactive
