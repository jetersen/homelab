name: TrueNAS Pulumi
on:
  pull_request:
    paths:
      - infrastructure/truenas/**
      - .forgejo/workflows/truenas.yaml
      - .ci/actions/setup-tool/**
  push:
    branches: [main]
    paths:
      - infrastructure/truenas/**
      - .forgejo/workflows/truenas.yaml
      - .ci/actions/setup-tool/**
  workflow_dispatch:
concurrency:
  group: truenas-pulumi
  cancel-in-progress: false
jobs:
  deploy:
    if: forgejo.event_name != 'pull_request' || forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: linux-docker
    timeout-minutes: 20
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.ci/actions/setup-tool
        with:
          tool: pulumi
      - name: Restore and build
        run: |
          python3 infrastructure/truenas/restore-provider.py
          dotnet restore infrastructure/truenas/Homelab.TrueNas.csproj --locked-mode
          dotnet build infrastructure/truenas/Homelab.TrueNas.csproj --no-restore
      - name: Preview
        env:
          TRUENAS_HOST: ${{ vars.TRUENAS_HOST }}
          TRUENAS_TOKEN: ${{ secrets.TRUENAS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PULUMI_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PULUMI_STATE_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          pulumi -C infrastructure/truenas preview --stack homelab --refresh --non-interactive
      - name: Apply
        if: forgejo.ref == 'refs/heads/main' && forgejo.event_name != 'pull_request'
        env:
          TRUENAS_HOST: ${{ vars.TRUENAS_HOST }}
          TRUENAS_TOKEN: ${{ secrets.TRUENAS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PULUMI_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PULUMI_STATE_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          pulumi -C infrastructure/truenas up --stack homelab --refresh --yes --non-interactive
