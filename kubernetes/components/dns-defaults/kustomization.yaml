---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/component_v1alpha1.json
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  # Native workloads expose the PodSpec directly.
  - target:
      group: apps
      version: v1
      kind: (Deployment|StatefulSet|DaemonSet)
      labelSelector: homelab.jetersen.dev/dns-profile=pod
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: not-used
      spec:
        template:
          spec:
            dnsConfig:
              options:
                - name: ndots
                  value: "1"
  # Chart values must be patched before Helm generates its workloads.
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      labelSelector: homelab.jetersen.dev/dns-profile=app-template
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: not-used
      spec:
        values:
          defaultPodOptions:
            dnsConfig:
              options:
                - name: ndots
                  value: "1"
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      labelSelector: homelab.jetersen.dev/dns-profile=pod
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: not-used
      spec:
        values:
          dnsConfig:
            options:
              - name: ndots
                value: "1"
  # VictoriaMetrics's operator creates the pods from these custom resources.
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      labelSelector: homelab.jetersen.dev/dns-profile=victoria-metrics
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: not-used
      spec:
        values:
          vmsingle:
            spec:
              dnsConfig:
                options:
                  - name: ndots
                    value: "1"
          vmagent:
            spec:
              dnsConfig:
                options:
                  - name: ndots
                    value: "1"
          vmalert:
            spec:
              dnsConfig:
                options:
                  - name: ndots
                    value: "1"
  # Insert before the existing Flux operator patches without replacing them.
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      labelSelector: homelab.jetersen.dev/dns-profile=flux-instance
    patch: |
      - op: add
        path: /spec/values/instance/kustomize/patches/0
        value:
          target:
            kind: Deployment
          patch: |
            - op: add
              path: /spec/template/spec/dnsConfig
              value:
                options:
                  - name: ndots
                    value: "1"
      # Keep the existing operator patches after this insertion.
