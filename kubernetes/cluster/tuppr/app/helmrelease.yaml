# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  releaseName: tuppr
  chartRef:
    kind: OCIRepository
    name: tuppr
  # The scheduled jobs own the live replica count between Helm upgrades.
  driftDetection:
    mode: disabled
  # Permit queued GitOps changes while the scheduled controller is offline.
  # A running webhook still rejects invalid plans; CRD validation always applies.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: admissionregistration.k8s.io
              version: v1
              kind: ValidatingWebhookConfiguration
              name: tuppr-validating-webhook
            patch: |-
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingWebhookConfiguration
              metadata:
                name: tuppr-validating-webhook
              webhooks:
                - name: vkubernetesupgrade.kb.io
                  failurePolicy: Ignore
                - name: vtalosupgrade.kb.io
                  failurePolicy: Ignore
  values:
    fullnameOverride: tuppr
    # Helm upgrades must keep an active cluster upgrade running.
    # Scheduled jobs scale the live Deployment to zero after completion.
    replicaCount: 1
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    controller:
      logFormat: json
    monitoring:
      dashboards:
        enabled: true
        namespace: monitoring
