# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  releaseName: tuppr
  chartRef:
    kind: OCIRepository
    name: tuppr
  # The scheduled jobs own the live replica count between Helm upgrades.
  driftDetection:
    mode: disabled
  values:
    fullnameOverride: tuppr
    replicaCount: 0
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    controller:
      logFormat: json
    monitoring:
      dashboards:
        enabled: true
        namespace: monitoring
