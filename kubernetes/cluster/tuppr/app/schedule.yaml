apiVersion: v1
kind: ServiceAccount
metadata:
  name: tuppr-schedule
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tuppr-schedule
rules:
  - apiGroups:
      - apps
    resources:
      - deployments/scale
    resourceNames:
      - tuppr
    verbs:
      - get
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tuppr-schedule
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tuppr-schedule
subjects:
  - kind: ServiceAccount
    name: tuppr-schedule
    namespace: system-upgrade
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuppr-schedule
rules:
  - apiGroups:
      - tuppr.home-operations.com
    resources:
      - talosupgrades
      - kubernetesupgrades
    resourceNames:
      - homelab
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tuppr-schedule
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tuppr-schedule
subjects:
  - kind: ServiceAccount
    name: tuppr-schedule
    namespace: system-upgrade
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tuppr-wake
spec:
  schedule: 55 3 * * 0
  timeZone: Europe/Copenhagen
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: tuppr-schedule
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: schedule
              image: docker.io/library/python:3.15-alpine@sha256:2699b90f4d562a22e2dd076c82f964032f64814204bff36d271a54ba4cc2c7e2
              command:
                - python
                - /scripts/controller-schedule.py
              args:
                - wake
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: tuppr-schedule
---
