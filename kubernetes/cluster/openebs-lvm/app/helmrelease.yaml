# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs-lvm
spec:
  chart:
    spec:
      chart: lvm-localpv
      version: 1.10.1
      sourceRef:
        kind: HelmRepository
        name: openebs-lvm
  values:
    fullnameOverride: openebs-lvm
    analytics:
      enabled: false
    lvmNode:
      kubeletDir: /var/lib/kubelet/
      logLevel: 2
    lvmController:
      logLevel: 2
      snapshotController:
        enabled: false
    crds:
      csi:
        volumeSnapshots:
          enabled: false
  # Chart 1.10.1 always includes this sidecar; omit unused CSI snapshot support.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: openebs-lvm-controller
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: openebs-lvm-controller
              spec:
                template:
                  spec:
                    containers:
                      - name: csi-snapshotter
                        $patch: delete
