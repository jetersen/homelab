# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs-lvm
spec:
  chart:
    spec:
      chart: lvm-localpv
      version: 1.10.1
      sourceRef:
        kind: HelmRepository
        name: openebs-lvm
  values:
    fullnameOverride: openebs-lvm
    analytics:
      enabled: false
    lvmNode:
      kubeletDir: /var/lib/kubelet/
      logLevel: 2
      resources:
        requests:
          cpu: 15m
          memory: 32Mi
    lvmController:
      logLevel: 2
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
      snapshotController:
        enabled: false
    crds:
      csi:
        volumeSnapshots:
          enabled: false
  # Chart 1.10.1 always includes this sidecar; omit unused CSI snapshot support.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: openebs-lvm-controller
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: openebs-lvm-controller
              spec:
                template:
                  spec:
                    containers:
                      - name: csi-resizer
                        securityContext: &nonroot
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: [ALL]
                      - name: csi-provisioner
                        securityContext: *nonroot
                        # Chart 1.10.1 has no extra-args value. Keep its defaults and
                        # own capacity records through the Deployment, not a ReplicaSet.
                        args:
                          - --csi-address=$(ADDRESS)
                          - --v=2
                          - --feature-gates=Topology=true
                          - --strict-topology
                          - --enable-capacity=true
                          - --extra-create-metadata=true
                          - --default-fstype=ext4
                          - --capacity-ownerref-level=2
                      - name: openebs-lvm-plugin
                        securityContext: *nonroot
                      - name: csi-snapshotter
                        $patch: delete
