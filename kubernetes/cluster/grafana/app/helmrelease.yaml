---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  releaseName: grafana
  chartRef:
    kind: OCIRepository
    name: grafana
  values:
    rbac:
      create: false
    automountServiceAccountToken: false
    testFramework:
      resources:
        requests:
          cpu: 10m
    envFromSecret: grafana-github-oauth
    grafana.ini:
      server:
        root_url: https://grafana.jetersen.dev
      # Renovate tracks upgrades; skip usage reporting and update checks.
      analytics:
        reporting_enabled: false
        check_for_updates: false
        check_for_plugin_updates: false
      # VictoriaMetrics and its Alertmanager own alert evaluation and delivery.
      unified_alerting:
        enabled: false
      auth:
        disable_login_form: true
        oauth_auto_login: false
      auth.github:
        enabled: true
        allow_sign_up: true
        allow_device_flow: false
        client_id: $__env{GF_AUTH_GITHUB_CLIENT_ID}
        client_secret: $__env{GF_AUTH_GITHUB_CLIENT_SECRET}
        scopes: user:email,read:org
        auth_url: https://github.com/login/oauth/authorize
        token_url: https://github.com/login/oauth/access_token
        api_url: https://api.github.com/user
        allowed_organizations: jetersen-cloud
        role_attribute_path: "[login=='jetersen'][0] && 'Admin' || 'Viewer'"
    # Use the pod fsGroup for ownership of the existing data directory.
    # Rely on pod fsGroup instead of the chart's init-chown-data container.
    initChownData:
      enabled: false
    persistence:
      enabled: true
      existingClaim: grafana-lvm
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
    plugins:
      - victoriametrics-logs-datasource
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            uid: P4169E866C3094E38
            type: prometheus
            url: http://vmsingle-vm:8428
            isDefault: true
            access: proxy
            jsonData:
              timeInterval: 60s
          - name: Alertmanager
            uid: homelab-alertmanager
            type: alertmanager
            url: http://vmalertmanager-vm:9093
            access: proxy
            jsonData:
              implementation: prometheus
              handleGrafanaManagedAlerts: false
          - name: VictoriaLogs
            type: victoriametrics-logs-datasource
            url: http://victoria-logs-single-server:9428
            access: proxy
    # Keep the provider identity while replacing the Kubernetes watcher with files.
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: sidecarProvider
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            allowUiUpdates: false
            # Poll rather than relying on filesystem events for ConfigMap updates.
            updateIntervalSeconds: 30
            options:
              path: /tmp/dashboards
    # Chart 13.5.0 exposes generic projected volumes through this mount option.
    # These are ConfigMaps only; no dashboard JSON is copied or downloaded.
    extraSecretMounts:
      - name: dashboard-files
        mountPath: /tmp/dashboards
        readOnly: true
        projected:
          sources:
            - configMap:
                name: homelab-alerts-dashboard
            - configMap:
                name: homelab-control-plane-dashboards
            - configMap:
                name: homelab-victoriametrics-dashboards
            - configMap:
                name: vm-dashboard-alertmanager-overview
            - configMap:
                name: vm-dashboard-controller-manager
            - configMap:
                name: vm-dashboard-k8s-resources-cluster
            - configMap:
                name: vm-dashboard-k8s-resources-namespace
            - configMap:
                name: vm-dashboard-k8s-resources-node
            - configMap:
                name: vm-dashboard-k8s-resources-nodes-overview
            - configMap:
                name: vm-dashboard-k8s-resources-pod
            - configMap:
                name: vm-dashboard-k8s-resources-workload
            - configMap:
                name: vm-dashboard-k8s-resources-workloads-namespace
            - configMap:
                name: vm-dashboard-kubernetes-system-coredns
            - configMap:
                name: vm-dashboard-kubernetes-views-nodes
            - configMap:
                name: vm-dashboard-kubernetes-views-pods
            - configMap:
                name: vm-dashboard-node-exporter-full
            - configMap:
                name: vm-dashboard-persistentvolumesusage
            - configMap:
                name: vm-dashboard-prometheus
            - configMap:
                name: vm-dashboard-prometheus-remote-write
            - configMap:
                name: vm-dashboard-scheduler
            - configMap:
                name: tuppr-dashboard
    sidecar:
      dashboards:
        enabled: false
