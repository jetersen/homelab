---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  releaseName: grafana
  chartRef:
    kind: OCIRepository
    name: grafana
  values:
    testFramework:
      resources:
        requests:
          cpu: 10m
    envFromSecret: grafana-github-oauth
    grafana.ini:
      server:
        root_url: https://grafana.jetersen.dev
      # Renovate tracks upgrades; skip usage reporting and update checks.
      analytics:
        reporting_enabled: false
        check_for_updates: false
        check_for_plugin_updates: false
      auth:
        disable_login_form: true
        oauth_auto_login: false
      auth.github:
        enabled: true
        allow_sign_up: true
        allow_device_flow: false
        client_id: $__env{GF_AUTH_GITHUB_CLIENT_ID}
        client_secret: $__env{GF_AUTH_GITHUB_CLIENT_SECRET}
        scopes: user:email,read:org
        auth_url: https://github.com/login/oauth/authorize
        token_url: https://github.com/login/oauth/access_token
        api_url: https://api.github.com/user
        allowed_organizations: jetersen-cloud
        role_attribute_path: "[login=='jetersen'][0] && 'Admin' || 'Viewer'"
    # Use the pod fsGroup for ownership of the existing data directory.
    # Rely on pod fsGroup instead of the chart's init-chown-data container.
    initChownData:
      enabled: false
    persistence:
      enabled: true
      existingClaim: grafana-lvm
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
    plugins:
      - victoriametrics-logs-datasource
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            uid: P4169E866C3094E38
            type: prometheus
            url: http://vmsingle-vm:8428
            isDefault: true
            access: proxy
            jsonData:
              timeInterval: 30s
          - name: Alertmanager
            uid: homelab-alertmanager
            type: alertmanager
            url: http://vmalertmanager-vm:9093
            access: proxy
            jsonData:
              implementation: prometheus
              handleGrafanaManagedAlerts: false
          - name: VictoriaLogs
            type: victoriametrics-logs-datasource
            url: http://victoria-logs-single-server:9428
            access: proxy
    sidecar:
      resources:
        requests:
          cpu: 15m
          memory: 96Mi
      dashboards:
        enabled: true
        searchNamespace: ALL
        label: grafana_dashboard
        labelValue: "1"
