# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
  labels:
    homelab.jetersen.dev/dns-profile: flux-instance
spec:
  chartRef:
    kind: OCIRepository
    name: flux-instance
  dependsOn:
    - name: flux-operator
      namespace: flux-system
  values:
    instance:
      distribution:
        # renovate: datasource=github-releases depName=controlplaneio-fluxcd/distribution
        version: 2.9.6
      cluster:
        networkPolicy: false
      components:
        - source-controller
        - kustomize-controller
        - helm-controller
        - notification-controller
      sync:
        name: homelab
        kind: OCIRepository
        url: oci://forgejo.jetersen.dev/jetersen/homelab/flux
        ref: main
        pullSecret: homelab-oci-auth
        path: kubernetes/flux
        interval: 1m
      kustomize:
        patches:
          - target:
              kind: Service
              name: webhook-receiver
            patch: |
              - op: add
                path: /spec/clusterIP
                value: 172.23.196.164
