# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
spec:
  chartRef:
    kind: OCIRepository
    name: flux-instance
  dependsOn:
    - name: flux-operator
      namespace: flux-system
  values:
    healthcheck:
      resources:
        limits:
          cpu: null
    instance:
      distribution:
        # renovate: datasource=github-releases depName=controlplaneio-fluxcd/distribution
        version: 2.9.6
      cluster:
        networkPolicy: false
      components:
        - source-controller
        - kustomize-controller
        - helm-controller
        - notification-controller
      sync:
        name: homelab
        kind: OCIRepository
        url: oci://forgejo.jetersen.dev/jetersen/homelab/flux
        ref: main
        pullSecret: homelab-oci-auth
        path: kubernetes/flux
        interval: 1m
      kustomize:
        patches:
          - target:
              kind: Deployment
              name: helm-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: helm-controller
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          requests:
                            cpu: 50m
                          limits:
                            cpu: null
          - target:
              kind: Deployment
              name: kustomize-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kustomize-controller
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          requests:
                            cpu: 50m
                          limits:
                            cpu: null
          - target:
              kind: Deployment
              name: notification-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: notification-controller
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          requests:
                            cpu: 15m
                          limits:
                            cpu: null
          - target:
              kind: Deployment
              name: source-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: source-controller
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          requests:
                            cpu: 15m
                          limits:
                            cpu: null
          - target:
              kind: Service
              name: webhook-receiver
            patch: |
              - op: add
                path: /spec/clusterIP
                value: 172.23.196.164
