apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-telemetry
  namespace: flux-system
  labels:
    homelab.jetersen.dev/flux-defaults: enabled
    homelab.jetersen.dev/flux-homelab-source: enabled
    homelab.jetersen.dev/flux-wait: disabled
spec:
  targetNamespace: monitoring
  dependsOn:
    - name: victoria-metrics-k8s-stack
    - name: victoria-logs
    - name: openebs-lvm
  path: ./kubernetes/cluster/agent-telemetry/app
