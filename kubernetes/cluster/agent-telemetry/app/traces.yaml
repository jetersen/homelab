apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-traces
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: openebs-lvm
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-traces
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: agent-traces
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: victoriametrics/victoria-traces:v0.13.0@sha256:3018df8f99429d7d3029167ab9f70848bf0a778c31c49dff16c86c7e34759fbd
        args:
        - -storageDataPath=/data
        - -retentionPeriod=14d
        - -storage.minFreeDiskSpaceBytes=1GiB
        ports:
        - name: http
          containerPort: 10428
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /health
            port: 10428
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 10428
          initialDelaySeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: agent-traces
---
apiVersion: v1
kind: Service
metadata:
  name: agent-traces
spec:
  selector:
    app.kubernetes.io/name: agent-traces
  ports:
  - name: http
    port: 10428
    targetPort: 10428
