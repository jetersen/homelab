apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-collector
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: openebs-lvm
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: agent-collector
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
        args:
        - --config=/etc/otel/config.yaml
        ports:
        - name: http
          containerPort: 4318
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/otel
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: agent-collector
      - name: config
        configMap:
          name: agent-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: agent-collector
  annotations:
    lbipam.cilium.io/ips: 192.168.1.23
spec:
  selector:
    app.kubernetes.io/name: agent-collector
  ports:
  - name: http
    port: 4318
    targetPort: 4318
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerSourceRanges:
  - 192.168.1.128/32
