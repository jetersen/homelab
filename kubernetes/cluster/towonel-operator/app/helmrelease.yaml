---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-operator
spec:
  chartRef:
    kind: OCIRepository
    name: towonel-operator
  values:
    resources:
      requests:
        cpu: 10m
      limits:
        cpu: null
    credentials:
      existingSecret: towonel-api
      tokenKey: token
    towonel:
      apiURL: https://hub.towonel.dev
