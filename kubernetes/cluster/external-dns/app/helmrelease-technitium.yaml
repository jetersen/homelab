---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Internal DNS tier, 1 of 2. Shares its record set and annotation prefix with
# external-dns-unifi; only the provider and txtOwnerId differ. external-dns
# supports one provider per instance, which is the sole reason these are two
# releases rather than one.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-technitium
  namespace: external-dns
spec:
  chartRef:
    name: external-dns
    kind: OCIRepository
  values:
    fullnameOverride: external-dns-technitium
    interval: 1440m0s
    managedRecordTypes:
      - A
      - AAAA
    policy: sync
    triggerLoopOnEvent: true
    txtOwnerId: homelab-technitium
    txtPrefix: "_owner_"
    annotationFilter: internal.external-dns.kubernetes.io/enabled notin (false)
    domainFilters:
      - jetersen.dev
    extraArgs:
      - --annotation-prefix=internal.external-dns.kubernetes.io/
      # Preserve the previous webhook's fallback for sources without a TTL.
      - --min-ttl=300s
      - --rfc2136-host=technitium-dns.technitium.svc.cluster.local
      - --rfc2136-port=53
      - --rfc2136-zone=jetersen.dev
      - --rfc2136-zone=lan.jetersen.dev
      - --rfc2136-tsig-keyname=external-dns-technitium
      - --rfc2136-tsig-secret-alg=hmac-sha256
      - --rfc2136-axfr
    sources:
      - crd
      - gateway-httproute
      - gateway-tcproute
    provider:
      name: rfc2136
    env:
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: external-dns-technitium-tsig
            key: EXTERNAL_DNS_RFC2136_TSIG_SECRET
