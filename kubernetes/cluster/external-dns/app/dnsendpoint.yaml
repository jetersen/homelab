---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: unifi
  namespace: external-dns
spec:
  endpoints:
    - dnsName: unifi.lan.jetersen.dev
      recordTTL: 300
      recordType: A
      targets:
        - 192.168.1.1
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: truenas
  namespace: external-dns
spec:
  endpoints:
    - dnsName: truenas.lan.jetersen.dev
      recordTTL: 300
      recordType: A
      targets:
        - 192.168.1.2
