---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
# Public DNS tier. Opt-in only: a resource must carry
# public.external-dns.alpha.kubernetes.io/enabled: "true" to be published to
# Cloudflare. Manages CNAMEs exclusively; every other record in the Cloudflare
# zone (apex Worker, MX, SPF/DMARC, CAA, DS, DKIM) is hand-maintained and stays
# unowned, which external-dns never touches.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  chartRef:
    name: external-dns
    kind: OCIRepository
  values:
    interval: 1440m0s
    managedRecordTypes:
      - CNAME
    policy: sync
    triggerLoopOnEvent: true
    txtOwnerId: homelab
    txtPrefix: "_owner_"
    annotationFilter: public.external-dns.alpha.kubernetes.io/enabled in (true)
    domainFilters:
      - jetersen.dev
    excludeDomains:
      - lan.jetersen.dev
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token-secret
            key: api-token
    extraArgs:
      - --annotation-prefix=public.external-dns.alpha.kubernetes.io/
      - --cloudflare-proxied
    sources:
      - gateway-httproute
      - gateway-grpcroute
      - gateway-tlsroute
      - gateway-tcproute
      - gateway-udproute
      - service
    provider:
      name: cloudflare
