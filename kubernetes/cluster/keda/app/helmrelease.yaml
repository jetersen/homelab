# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
spec:
  releaseName: keda
  chartRef:
    kind: OCIRepository
    name: keda
  values:
    watchNamespace: forgejo-runners
    # ScaledJobs are scaled by the operator without the external metrics API.
    metricsServer:
      enabled: false
      registerAPIService: false
    rbac:
      enabledCustomScaledRefKinds: false
    resources:
      operator:
        requests:
          cpu: 10m
          memory: 100Mi
        limits:
          cpu: null
          memory: 512Mi
      webhooks:
        requests:
          cpu: 5m
          memory: 100Mi
        limits:
          cpu: null
          memory: 512Mi
