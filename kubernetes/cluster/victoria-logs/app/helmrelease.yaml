---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  releaseName: victoria-logs-single
  chartRef:
    kind: OCIRepository
    name: victoria-logs-single
  values:
    server:
      vmServiceScrape:
        enabled: true
      retentionPeriod: 1y
      persistentVolume:
        enabled: true
        existingClaim: server-volume-victoria-logs-single-server-0-lvm
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
