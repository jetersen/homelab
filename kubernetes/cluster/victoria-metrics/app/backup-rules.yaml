apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: application-backups
spec:
  groups:
  - name: homelab.backups
    rules:
    - alert: ApplicationBackupFailed
      expr: "(max by (namespace, cronjob) (\n  label_replace(\n    kube_job_status_start_time\n\
        \    * on (namespace, job_name) (kube_job_failed{condition=\"true\"} == 1)\n\
        \    * on (namespace, job_name) group_left (owner_name) kube_job_owner{owner_kind=\"\
        CronJob\",owner_name=~\"home-assistant-backup|zigbee2mqtt-backup|sonarr-backup|.*-backup-maintenance\"\
        },\n    \"cronjob\", \"$1\", \"owner_name\", \"(.*)\"\n  )\n) > on (namespace,\
        \ cronjob) kube_cronjob_status_last_successful_time)\nor\n(max by (namespace,\
        \ cronjob) (\n  label_replace(\n    kube_job_status_start_time\n    * on (namespace,\
        \ job_name) (kube_job_failed{condition=\"true\"} == 1)\n    * on (namespace,\
        \ job_name) group_left (owner_name) kube_job_owner{owner_kind=\"CronJob\"\
        ,owner_name=~\"home-assistant-backup|zigbee2mqtt-backup|sonarr-backup|.*-backup-maintenance\"\
        },\n    \"cronjob\", \"$1\", \"owner_name\", \"(.*)\"\n  )\n) unless on (namespace,\
        \ cronjob) kube_cronjob_status_last_successful_time)"
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: Backup job failed for {{ $labels.namespace }}/{{ $labels.cronjob
          }}
        description: The latest failed job has not been followed by a successful backup
          or maintenance run.
    - alert: ApplicationBackupStale
      expr: "(\n  time() - kube_cronjob_status_last_successful_time{namespace=~\"\
        home-assistant|media\",cronjob=~\"home-assistant-backup|zigbee2mqtt-backup|sonarr-backup\"\
        } > 108000\n  or\n  ((time() - kube_cronjob_created{namespace=~\"home-assistant|media\"\
        ,cronjob=~\"home-assistant-backup|zigbee2mqtt-backup|sonarr-backup\"} > 108000)\n\
        \   unless on (namespace, cronjob) kube_cronjob_status_last_successful_time)\n\
        )\nand on (namespace, cronjob) (kube_cronjob_spec_suspend == 0)"
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.cronjob }} has no recent successful run'
        description: Inspect the backup workflow and repository access before relying
          on recovery.
    - alert: BackupMaintenanceStale
      expr: "(\n  time() - kube_cronjob_status_last_successful_time{namespace=~\"\
        home-assistant|media\",cronjob=~\".*-backup-maintenance\"} > 172800\n  or\n\
        \  ((time() - kube_cronjob_created{namespace=~\"home-assistant|media\",cronjob=~\"\
        .*-backup-maintenance\"} > 172800)\n   unless on (namespace, cronjob) kube_cronjob_status_last_successful_time)\n\
        )\nand on (namespace, cronjob) (kube_cronjob_spec_suspend == 0)"
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.cronjob }} has no recent successful run'
        description: Inspect the backup workflow and repository access before relying
          on recovery.
    - alert: BackupMonitoringMissing
      expr: 'absent(kube_cronjob_info{namespace="home-assistant",cronjob="home-assistant-backup"})

        or

        absent(kube_cronjob_info{namespace="home-assistant",cronjob="zigbee2mqtt-backup"})

        or

        absent(kube_cronjob_info{namespace="media",cronjob="sonarr-backup"})'
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Backup schedule metrics are missing
        description: The backup schedule is absent or kube-state-metrics is not reporting
          it.
