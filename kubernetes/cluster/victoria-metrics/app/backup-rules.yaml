# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: application-backups
spec:
  groups:
  - name: homelab.backups
    rules:
    - alert: ApplicationBackupFailed
      expr: min by (namespace, policy) (kopiur_snapshotpolicy_last_backup_success) == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Latest Kopiur backup failed for {{ $labels.namespace }}/{{ $labels.policy }}
    - alert: ApplicationBackupStale
      expr: "(\n  time() - kopiur_policy_last_backup_success_timestamp_seconds > 108000\n  or\n  (label_replace(time() - homelab_kopiur_schedule_created, \"policy\", \"$1\", \"name\", \"(.*)\") > 108000\n   unless on (namespace, policy) kopiur_policy_last_backup_success_timestamp_seconds)\n)\nand on (namespace, policy)\n  label_replace(homelab_kopiur_schedule_suspended == 0, \"policy\", \"$1\", \"name\", \"(.*)\")"
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: No recent Kopiur backup for {{ $labels.namespace }}/{{ $labels.policy }}
    - alert: BackupRepositoryUnavailable
      expr: max by (namespace, name) (kopiur_resource_phase{kind="Repository",phase=~"Degraded|Failed"}) == 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Kopiur repository {{ $labels.namespace }}/{{ $labels.name }} is unavailable
    - alert: BackupMaintenanceFailed
      expr: homelab_kopiur_maintenance_full_failures > 0 or homelab_kopiur_maintenance_quick_failures > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Kopiur maintenance failed for {{ $labels.namespace }}/{{ $labels.name }}
    - alert: BackupMaintenanceStale
      expr: '(time() - homelab_kopiur_maintenance_full_last_success_timestamp_seconds > 172800)

        and on (namespace, name) (time() - homelab_kopiur_maintenance_created > 172800)'
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: No recent full Kopiur maintenance for {{ $labels.namespace }}/{{ $labels.name }}
    - alert: BackupReplicationStale
      expr: time() - homelab_kopiur_replication_last_success_timestamp_seconds > 7200
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: No successful offsite replication within two hours for {{ $labels.namespace }}/{{ $labels.name }}
    - alert: BackupMonitoringMissing
      expr: absent(homelab_kopiur_schedule_created{namespace="home-assistant",name="home-assistant-backup"}) or absent(homelab_kopiur_schedule_created{namespace="home-assistant",name="zigbee2mqtt-backup"}) or absent(homelab_kopiur_schedule_created{namespace="media",name="sonarr-backup"}) or absent(homelab_kopiur_schedule_created{namespace="forgejo",name="forgejo-backup"}) or absent(homelab_kopiur_schedule_created{namespace="photoprism",name="photoprism-state"}) or absent(homelab_kopiur_schedule_created{namespace="photoprism",name="photoprism-originals"})
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: A Kopiur backup schedule or its metrics are missing
