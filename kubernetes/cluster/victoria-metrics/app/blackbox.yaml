# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/configmap_v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter
data:
  blackbox.yaml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          preferred_ip_protocol: ip4
      tcp_connect:
        prober: tcp
        timeout: 5s
        tcp:
          preferred_ip_protocol: ip4
      dns_udp:
        prober: dns
        timeout: 5s
        dns:
          query_name: home.jetersen.dev
          query_type: A
          transport_protocol: udp
          preferred_ip_protocol: ip4
          valid_rcodes:
          - NOERROR
          validate_answer_rrs:
            fail_if_not_matches_regexp:
            - .*192\.168\.1\.20.*
      dns_recursion_udp:
        prober: dns
        timeout: 5s
        dns:
          query_name: example.com
          query_type: A
          transport_protocol: udp
          preferred_ip_protocol: ip4
          valid_rcodes:
          - NOERROR
          validate_answer_rrs:
            fail_if_none_matches_regexp:
            - '.*\s+IN\s+A\s+.*'
      dns_recursion_tcp:
        prober: dns
        timeout: 5s
        dns:
          query_name: example.com
          query_type: A
          transport_protocol: tcp
          preferred_ip_protocol: ip4
          valid_rcodes:
          - NOERROR
          validate_answer_rrs:
            fail_if_none_matches_regexp:
            - '.*\s+IN\s+A\s+.*'

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: blackbox-exporter
        image: quay.io/prometheus/blackbox-exporter:v0.28.0
        args:
        - --config.file=/etc/blackbox/blackbox.yaml
        ports:
        - name: http
          containerPort: 9115
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /-/healthy
            port: http
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
        volumeMounts:
        - name: config
          mountPath: /etc/blackbox
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: blackbox-exporter
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/service_v1.json
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  labels:
    app: blackbox-exporter
spec:
  selector:
    app: blackbox-exporter
  ports:
  - name: http
    port: 9115
    targetPort: http
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmservicescrape_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: blackbox-exporter
spec:
  selector:
    matchLabels:
      app: blackbox-exporter
  endpoints:
  - port: http
