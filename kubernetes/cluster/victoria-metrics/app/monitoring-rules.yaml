# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: homelab-monitoring
spec:
  groups:
  - name: homelab.service-health
    rules:
    - alert: MonitoringConfigReloaderDown
      expr: up{job=~".*(vmagent|vmalert|vmalertmanager).*",container="config-reloader"} == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Monitoring configuration reloader is down for {{ $labels.job }}
        description: The configuration reloader has been unavailable for five minutes.
          Configuration changes may not take effect even while the main service remains available.
    - alert: ServiceProbeFailed
      expr: probe_success == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Service probe failed for {{ $labels.instance }}
        description: The {{ $labels.job }} probe has failed continuously for five
          minutes.
    # Keep expected target counts aligned with probes.yaml and notifications' VMProbe.
    - alert: ServiceProbeMetricsMissing
      expr: |
        up{job=~"application-http|nas-mqtt-tcp|technitium-dns|dns-recursion-udp|dns-recursion-tcp|gateway-https|notifications"} == 0
        or (up{job=~"application-http|nas-mqtt-tcp|technitium-dns|dns-recursion-udp|dns-recursion-tcp|gateway-https|notifications"}
          unless on(job, instance) probe_success)
        or count by(job) (up{job="application-http"}) < 11
        or count by(job) (up{job="nas-mqtt-tcp"}) < 3
        or count by(job) (up{job="technitium-dns"}) < 4
        or count by(job) (up{job="dns-recursion-udp"}) < 3
        or count by(job) (up{job="dns-recursion-tcp"}) < 3
        or count by(job) (up{job="gateway-https"}) < 3
        or count by(job) (up{job="notifications"}) < 2
        or absent(up{job="application-http"})
        or absent(up{job="nas-mqtt-tcp"})
        or absent(up{job="technitium-dns"})
        or absent(up{job="dns-recursion-udp"})
        or absent(up{job="dns-recursion-tcp"})
        or absent(up{job="gateway-https"})
        or absent(up{job="notifications"})
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Probe metrics unavailable for {{ $labels.job }}
        description: The blackbox exporter could not supply probe metrics for this
          configured job or target. Check its scrape and expected probe targets.
    - alert: EnvoyConfigurationRejected
      expr: increase(envoy_listener_manager_lds_update_rejected[5m]) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: Envoy rejected listener configuration on {{ $labels.pod }}
        description: Inspect Envoy's listener rejection errors; Gateway and policy
          status alone do not verify that the proxy loaded its listeners.
    - alert: VictoriaLogsDroppedRows
      expr: sum(increase(vl_rows_dropped_total[10m])) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: VictoriaLogs is dropping log rows
        description: Inspect ingestion errors and timestamp/field limits; rows were
          discarded over the last ten minutes.
    - alert: VictoriaLogsIngestionStopped
      expr: sum(increase(vl_rows_ingested_total[15m])) == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: VictoriaLogs ingestion has stopped
        description: No logs were ingested for at least fifteen minutes while this
          cluster normally emits continuous logs.
    - alert: VictoriaLogsMetricsMissing
      expr: absent(vl_rows_ingested_total)
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: VictoriaLogs metrics are missing
        description: VictoriaLogs ingestion health cannot be monitored because its
          metrics series is absent.
    - alert: FluxReconciliationFailed
      expr: gotk_reconcile_condition{type="Ready",status="False"} == 1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Flux resource {{ $labels.name }} is not ready
        description: '{{ $labels.kind }} in {{ $labels.namespace }} remains unready
          after fifteen minutes.'
    - alert: CertificateExpiresSoon
      expr: last_over_time(certmanager_certificate_expiration_timestamp_seconds[15m]) - time() < 7 * 24
        * 3600
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: Certificate {{ $labels.name }} expires within seven days
        description: Inspect cert-manager renewal and DNS validation before this certificate
          expires.
    # Expected Certificates include the Kopiur chart's generated webhook Certificate.
    - alert: CertificateMetricsMissing
      expr: |
        absent_over_time(certmanager_certificate_expiration_timestamp_seconds{name="glkvm",exported_namespace="home-assistant"}[15m])
        or absent_over_time(certmanager_certificate_expiration_timestamp_seconds{name="jetersen-dev",exported_namespace="kube-system"}[15m])
        or absent_over_time(certmanager_certificate_expiration_timestamp_seconds{name="kopiur-webhook",exported_namespace="kopiur-system"}[15m])
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Certificate expiry metrics are missing for {{ $labels.exported_namespace }}/{{ $labels.name }}
        description: No expiry metric was collected for this expected certificate
          in fifteen minutes, allowing for the five-minute certificate scrape.
          Check the Certificate resource and cert-manager metrics scrape.
  - name: homelab.etcd-disk
    rules:
    # The node's NVMe drive lacks power-loss protection, so routine flushes keep
    # p99 fsync near 125 ms on this single-member cluster. Alert only at the
    # upstream critical threshold, where etcd stability is at risk.
    - alert: etcdHighFsyncDurations
      expr: histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket{job=~".*etcd.*"}[5m])) > 1
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: etcd cluster 99th percentile fsync durations are too high.
        description: 'etcd cluster "{{ $labels.job }}": 99th percentile fsync durations are {{ $value }}s on etcd instance {{ $labels.instance }}.'
