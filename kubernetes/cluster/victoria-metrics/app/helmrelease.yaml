---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  labels:
    homelab.jetersen.dev/dns-profile: victoria-metrics
spec:
  releaseName: vm
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  values:
    fullnameOverride: vm
    grafana:
      enabled: false
    defaultDashboards:
      enabled: true
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: 30d
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
    # Talos generates localhost serving certificates for these authenticated endpoints.
    kubeControllerManager:
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true
    kubeScheduler:
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true
    # Talos runs etcd as a host service, with a separate metrics-only listener.
    kubeEtcd:
      endpoints:
        - 192.168.1.10
      service:
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: http
    vmagent:
      enabled: true
      spec:
        selectAllByDefault: true
        scrapeInterval: 20s
    victoria-metrics-operator:
      enabled: true
    kube-state-metrics:
      rbac:
        extraRules:
          - apiGroups: [kopiur.home-operations.com]
            resources: [maintenances, repositoryreplications, snapshotschedules]
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: kopiur.home-operations.com
                  version: v1alpha1
                  kind: Maintenance
                metricNamePrefix: homelab_kopiur
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: maintenance_created
                    help: Creation timestamp of a Kopiur maintenance resource.
                    each:
                      type: Gauge
                      gauge:
                        path: [metadata, creationTimestamp]
                  - name: maintenance_full_last_success_timestamp_seconds
                    help: Last successful full maintenance timestamp.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, full, lastRunAt]
                        nilIsZero: true
                  - name: maintenance_full_failures
                    help: Consecutive failed full maintenance runs.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, full, consecutiveFailures]
                        nilIsZero: true
                  - name: maintenance_quick_failures
                    help: Consecutive failed quick maintenance runs.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, quick, consecutiveFailures]
                        nilIsZero: true
              - groupVersionKind:
                  group: kopiur.home-operations.com
                  version: v1alpha1
                  kind: RepositoryReplication
                metricNamePrefix: homelab_kopiur
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: replication_last_success_timestamp_seconds
                    help: Last successful offsite replication timestamp.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, lastReplicated]
                        nilIsZero: true
              - groupVersionKind:
                  group: kopiur.home-operations.com
                  version: v1alpha1
                  kind: SnapshotSchedule
                metricNamePrefix: homelab_kopiur
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: schedule_created
                    help: Creation timestamp of a Kopiur snapshot schedule.
                    each:
                      type: Gauge
                      gauge:
                        path: [metadata, creationTimestamp]
                  - name: schedule_suspended
                    help: Whether a Kopiur snapshot schedule is suspended.
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, schedule, suspend]
                        nilIsZero: true
