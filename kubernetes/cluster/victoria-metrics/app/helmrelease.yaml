---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  releaseName: vm
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  values:
    fullnameOverride: vm
    defaultRules:
      rules:
        # CPU quota throttling is expected on this small node; alert on service impact.
        CPUThrottlingHigh:
          enabled: false
        # etcd's basic metrics mode does not publish the gRPC latency histogram.
        etcdGRPCRequestsSlow:
          enabled: false
        # Reloaders have a separate warning; keep main-service outages critical.
        ServiceDown:
          spec:
            expr: up{job=~".*(victoriametrics|vmselect|vminsert|vmstorage|vmagent|vmalert|vmsingle|vmalertmanager|vmauth).*",container!="config-reloader"} == 0
        # No down targets is a healthy zero, not a missing recording-rule result.
        count:up0:
          spec:
            expr: count(up == 0) without(instance,pod,node) or vector(0)
    alertmanager:
      spec:
        secrets:
          - chaski-alertmanager-auth
      config:
        route:
          receiver: blackhole
          group_by: [alertname, namespace, severity]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - receiver: blackhole
              matchers:
                - alertname=~"Watchdog|InfoInhibitor"
            - receiver: chaski
              matchers:
                - severity=~"warning|critical"
        inhibit_rules:
          - source_matchers: [severity="critical"]
            target_matchers: [severity="warning"]
            equal: [alertname, namespace]
        receivers:
          - name: blackhole
          - name: chaski
            webhook_configs:
              - url: http://chaski.monitoring.svc.cluster.local:8080/hooks/alertmanager
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/vm/secrets/chaski-alertmanager-auth/token
    grafana:
      enabled: false
    defaultDashboards:
      enabled: true
      # Corrected, pinned upstream dashboards are provisioned by Grafana's Kustomization.
      dashboards:
        apiserver:
          enabled: false
        kubelet:
          enabled: false
        etcd:
          enabled: false
        kubernetes-views-global:
          enabled: false
        kubernetes-views-namespaces:
          enabled: false
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: 1y
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 2Gi
    vmalert:
      spec:
        extraArgs:
          external.url: https://grafana.jetersen.dev
          external.alert.source: 'explore?orgId=1&left={"datasource":"P4169E866C3094E38","queries":[{"refId":"A","expr":"{{`{{.Expr|queryEscape}}`}}"}]}'
    # Talos generates localhost serving certificates for these authenticated endpoints.
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              metricRelabelConfigs:
                # Retain sums and counts for the diagnostics dashboard's means/rates.
                - action: drop
                  source_labels: [__name__]
                  regex: '(apiserver_request_duration_seconds|etcd_request_duration_seconds|apiserver_request_body_size_bytes|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|apiserver_response_sizes|apiserver_watch_events_sizes)_bucket'
    kubeControllerManager:
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true
    kubeScheduler:
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true
    # Talos runs etcd as a host service, with a separate metrics-only listener.
    kubeEtcd:
      endpoints:
        - 192.168.1.10
      service:
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: http
    vmagent:
      enabled: true
      spec:
        selectAllByDefault: true
        scrapeInterval: 30s
    kubelet:
      vmScrapes:
        # cAdvisor supplies the container CPU and memory metrics used by our rules.
        resources:
          enabled: false
        probes:
          spec:
            # Keep failure counters for transient readiness/startup diagnostics.
            metricRelabelConfigs:
              - action: labeldrop
                regex: (uid|id|name)
              - action: drop
                source_labels: [__name__]
                regex: 'prober_probe_duration_seconds_(bucket|sum|count)'
    victoria-metrics-operator:
      enabled: true
    kube-state-metrics:
      vmScrape:
        spec:
          endpoints:
            # Readiness and metadata used by workload joins stay at the default 30s.
            - port: http
              honorLabels: true
              metricRelabelConfigs:
                - action: labeldrop
                  regex: (uid|container_id|image_id)
                - action: drop
                  source_labels: [__name__]
                  regex: '(kube_(namespace|deployment|statefulset|daemonset|networkpolicy|service|configmap|secret|persistentvolume|persistentvolumeclaim)_created|kube_endpointslice_info)'
            - port: http
              honorLabels: true
              interval: 2m
              relabelConfigs:
                - target_label: job
                  replacement: kube-state-metrics-inventory
              metricRelabelConfigs:
                - action: labeldrop
                  regex: (uid|container_id|image_id)
                - action: keep
                  source_labels: [__name__]
                  regex: '(kube_(namespace|deployment|statefulset|daemonset|networkpolicy|service|configmap|secret|persistentvolume|persistentvolumeclaim)_created|kube_endpointslice_info)'
      rbac:
        extraRules:
          - apiGroups: [kopiur.home-operations.com]
            resources: [maintenances, repositoryreplications, snapshotschedules]
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: kopiur.home-operations.com
                  version: v1alpha1
                  kind: Maintenance
                metricNamePrefix: homelab_kopiur
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: maintenance_created
                    help: Creation timestamp of a Kopiur maintenance resource.
                    each:
                      type: Gauge
                      gauge:
                        path: [metadata, creationTimestamp]
                  - name: maintenance_full_last_success_timestamp_seconds
                    help: Last successful full maintenance timestamp.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, full, lastRunAt]
                        nilIsZero: true
                  - name: maintenance_full_failures
                    help: Consecutive failed full maintenance runs.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, full, consecutiveFailures]
                        nilIsZero: true
                  - name: maintenance_quick_failures
                    help: Consecutive failed quick maintenance runs.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, quick, consecutiveFailures]
                        nilIsZero: true
              - groupVersionKind:
                  group: kopiur.home-operations.com
                  version: v1alpha1
                  kind: RepositoryReplication
                metricNamePrefix: homelab_kopiur
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: replication_last_success_timestamp_seconds
                    help: Last successful offsite replication timestamp.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, lastReplicated]
                        nilIsZero: true
              - groupVersionKind:
                  group: kopiur.home-operations.com
                  version: v1alpha1
                  kind: SnapshotSchedule
                metricNamePrefix: homelab_kopiur
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: schedule_created
                    help: Creation timestamp of a Kopiur snapshot schedule.
                    each:
                      type: Gauge
                      gauge:
                        path: [metadata, creationTimestamp]
                  - name: schedule_suspended
                    help: Whether a Kopiur snapshot schedule is suspended.
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, schedule, suspend]
                        nilIsZero: true
