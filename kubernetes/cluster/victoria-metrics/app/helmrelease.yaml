---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  releaseName: vm
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  values:
    syncJob:
      resources:
        requests:
          cpu: 10m
    fullnameOverride: vm
    defaultRules:
      group:
        spec:
          interval: 60s
      groups:
        # This single-user cluster has no API availability SLO or error budget.
        kube-apiserver-availability.rules:
          enabled: false
        kube-apiserver-burnrate.rules:
          enabled: false
        kube-apiserver-histogram.rules:
          enabled: false
        kube-apiserver-slos:
          enabled: false
        # Workloads omit CPU limits, so these recording rules never produce data.
        k8s.rules.container_cpu_limits:
          enabled: false
      rules:
        # Fixed rate windows need several samples at the one-minute scrape cadence.
        instance:node_cpu:rate:sum:
          spec:
            expr: sum(rate(node_cpu_seconds_total{mode!="idle",mode!="iowait",mode!="steal"}[5m])) by(instance)
        instance:node_network_receive_bytes:rate:sum:
          spec:
            expr: sum(rate(node_network_receive_bytes_total[5m])) by(instance)
        instance:node_network_transmit_bytes:rate:sum:
          spec:
            expr: sum(rate(node_network_transmit_bytes_total[5m])) by(instance)
        KubeAggregatedAPIErrors:
          spec:
            expr: sum(increase(aggregator_unavailable_apiservice_total{job="apiserver"}[5m])) by(cluster,instance,name,reason) > 0
        NodeNetworkReceiveErrs:
          spec:
            expr: (rate(node_network_receive_errs_total{job="node-exporter"}[5m]) / rate(node_network_receive_packets_total{job="node-exporter"}[5m])) > 0.01
        NodeNetworkTransmitErrs:
          spec:
            expr: (rate(node_network_transmit_errs_total{job="node-exporter"}[5m]) / rate(node_network_transmit_packets_total{job="node-exporter"}[5m])) > 0.01
        NodeCPUHighUsage:
          spec:
            expr: (sum(avg(rate(node_cpu_seconds_total{job="node-exporter",mode!~"idle|iowait"}[5m])) without(cpu)) without(mode) * 100) > 90
        NodeNetworkInterfaceFlapping:
          spec:
            expr: changes(node_network_up{job="node-exporter",device!~"veth.+"}[5m]) > 2
        TooManyErrorLogs:
          spec:
            expr: sum(increase(vm_log_messages_total{level=~"error|fatal|panic"}[5m])) without(app_version,is_printed) > 0
        ConcurrentInsertsHitTheLimit:
          spec:
            expr: avg_over_time(vm_concurrent_insert_current[5m]) >= vm_concurrent_insert_capacity
        PersistentQueueRunsOutOfSpaceIn12Hours:
          spec:
            expr: (((sum(vm_persistentqueue_free_disk_space_bytes) by(job,instance,path) / (sum(deriv(vm_persistentqueue_bytes_pending[5m])) by(job,instance,path) > 0)) * on(job,instance,path) group_left(url) ((vmagent_remotewrite_pending_data_bytes * 0) + 1)) < 43200) > 0
        PersistentQueueRunsOutOfSpaceIn4Hours:
          spec:
            expr: (((sum(vm_persistentqueue_free_disk_space_bytes) by(job,instance,path) / (sum(deriv(vm_persistentqueue_bytes_pending[5m])) by(job,instance,path) > 0)) * on(job,instance,path) group_left(url) ((vmagent_remotewrite_pending_data_bytes * 0) + 1)) < 14400) > 0
        # One Alertmanager replica needs one delivery-failure alert.
        AlertmanagerClusterFailedToSendAlerts:
          enabled: false
        AlertmanagerFailedToSendAlerts:
          spec:
            labels:
              severity: critical
        # An idle scheduler has zero histogram observations and no quantile result.
        RecordingRulesNoData:
          spec:
            expr: sum(vmalert_recording_rules_last_evaluation_samples{group!="kube-scheduler.rules"}) without(id) < 1
        # Workloads omit CPU limits; alert on service impact instead of quota throttling.
        CPUThrottlingHigh:
          enabled: false
        # etcd's basic metrics mode does not publish the gRPC latency histogram.
        etcdGRPCRequestsSlow:
          enabled: false
        # Local rules keep only the critical fsync threshold for this drive.
        etcdHighFsyncDurations:
          enabled: false
        etcdHighCommitDurations:
          enabled: false
        # Reloaders have a separate warning; keep main-service outages critical.
        ServiceDown:
          spec:
            expr: up{job=~".*(victoriametrics|vmselect|vminsert|vmstorage|vmagent|vmalert|vmsingle|vmalertmanager|vmauth).*",container!="config-reloader"} == 0
        # No down targets is a healthy zero, not a missing recording-rule result.
        count:up0:
          spec:
            expr: count(up == 0) without(instance,pod,node) or vector(0)
    alertmanager:
      spec:
        # Run as UID 65534 with a read-only root filesystem and no capabilities.
        useStrictSecurity: true
        resources:
          requests:
            cpu: 5m
            memory: 56Mi
          limits:
            memory: 256Mi
        secrets:
          - chaski-alertmanager-auth
      config:
        route:
          receiver: blackhole
          group_by: [alertname, namespace, severity]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - receiver: blackhole
              matchers:
                - alertname=~"Watchdog|InfoInhibitor"
            - receiver: chaski
              matchers:
                - severity=~"warning|critical"
        inhibit_rules:
          - source_matchers: [severity="critical"]
            target_matchers: [severity="warning"]
            equal: [alertname, namespace]
        receivers:
          - name: blackhole
          - name: chaski
            webhook_configs:
              - url: http://chaski.monitoring.svc.cluster.local:8080/hooks/alertmanager
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/vm/secrets/chaski-alertmanager-auth/token
    grafana:
      enabled: false
    defaultDashboards:
      enabled: true
      # Corrected, pinned upstream dashboards are provisioned by Grafana's Kustomization.
      dashboards:
        apiserver:
          enabled: false
        kubelet:
          enabled: false
        etcd:
          enabled: false
        kubernetes-views-global:
          enabled: false
        kubernetes-views-namespaces:
          enabled: false
        # Homelab has one Linux node; these upstream views do not apply.
        k8s-resources-multicluster:
          enabled: false
        k8s-resources-windows-cluster:
          enabled: false
        k8s-resources-windows-namespace:
          enabled: false
        k8s-resources-windows-pod:
          enabled: false
        k8s-windows-cluster-rsrc-use:
          enabled: false
        k8s-windows-node-rsrc-use:
          enabled: false
        nodes-aix:
          enabled: false
        nodes-darwin:
          enabled: false
        # Keep the corrected global/namespace views and detailed workload/node views.
        cluster-total:
          enabled: false
        pod-total:
          enabled: false
        workload-total:
          enabled: false
        namespace-by-pod:
          enabled: false
        namespace-by-workload:
          enabled: false
        nodes:
          enabled: false
        node-cluster-rsrc-use:
          enabled: false
        node-rsrc-use:
          enabled: false
        kubernetes-system-api-server:
          enabled: false
        # Local overrides omit startup flag tables and controller latency percentiles.
        victoriametrics-single-node:
          enabled: false
        victoriametrics-vmagent:
          enabled: false
        victoriametrics-vmalert:
          enabled: false
        victoriametrics-operator:
          enabled: false
      sources:
        victoriametrics-single-node:
          enabled: false
        victoriametrics-vmagent:
          enabled: false
        victoriametrics-vmalert:
          enabled: false
        victoriametrics-operator:
          enabled: false
    vmsingle:
      enabled: true
      spec:
        # Run as UID 65534 with a read-only root filesystem and no capabilities.
        useStrictSecurity: true
        retentionPeriod: 1y
        storage: null
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: vmsingle-vm-lvm
        volumeMounts:
          - name: data
            mountPath: /victoria-metrics-data
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 2Gi
    vmalert:
      spec:
        evaluationInterval: 60s
        # Run as UID 65534 with a read-only root filesystem and no capabilities.
        useStrictSecurity: true
        resources:
          requests:
            cpu: 15m
            memory: 200Mi
          limits:
            memory: 500Mi
        extraArgs:
          external.url: https://grafana.jetersen.dev
          external.alert.source: 'explore?orgId=1&left={"datasource":"P4169E866C3094E38","queries":[{"refId":"A","expr":"{{`{{.Expr|queryEscape}}`}}"}]}'
    # Talos generates localhost serving certificates for these authenticated endpoints.
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              metricRelabelConfigs:
                # Retain sums and counts for the diagnostics dashboard's means/rates.
                - action: drop
                  source_labels: [__name__]
                  regex: '(apiserver_request_sli_duration_seconds|apiserver_request_duration_seconds|etcd_request_duration_seconds|apiserver_request_body_size_bytes|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|apiserver_response_sizes|apiserver_watch_events_sizes)_bucket'
    kubeControllerManager:
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true
    kubeScheduler:
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true
    # Talos runs etcd as a host service, with a separate metrics-only listener.
    kubeEtcd:
      endpoints:
        - 192.168.1.10
      service:
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: http
    vmagent:
      enabled: true
      spec:
        # Run as UID 65534 with a read-only root filesystem and no capabilities.
        useStrictSecurity: true
        selectAllByDefault: true
        scrapeInterval: 60s
        # Remove this filter to re-enable optional diagnostic series for future samples.
        # Histogram sums/counts, queue latency, and OOM signals remain available.
        inlineRelabelConfig:
          # Optional dashboard panels are omitted by the pinned local overrides.
          - action: drop
            source_labels: [__name__]
            regex: '(flag|controller_runtime_reconcile_time_seconds_bucket)'
          - action: drop
            source_labels: [__name__]
            regex: '(container_tasks_state|container_memory_failures_total|container_file_descriptors|container_sockets|container_threads|container_threads_max|container_ulimits_soft|workqueue_work_duration_seconds_bucket|scheduler_plugin_execution_duration_seconds_bucket)'
          # Unused inventory and histogram buckets; retain sums/counts and GC diagnostics.
          - action: drop
            source_labels: [__name__]
            regex: '(kubernetes_feature_enabled|container_blkio_device_usage_total|informer_processing_latency_seconds_bucket|rest_client_rate_limiter_duration_seconds_bucket|rest_client_request_size_bytes_bucket|rest_client_response_size_bytes_bucket|gotk_reconcile_duration_seconds_bucket|envoy_cluster_update_duration_bucket)'
        resources:
          requests:
            cpu: 50m
            memory: 200Mi
          limits:
            memory: 500Mi
    kubelet:
      vmScrape:
        spec:
          interval: 60s
      vmScrapes:
        cadvisor:
          spec:
            metricRelabelConfigs:
              - action: labeldrop
                regex: (uid|id|name)
              - action: drop
                source_labels: [__name__]
                regex: 'rest_client_request_duration_seconds_(bucket|sum|count)'
              # Host interfaces are repeated by every host-networked pod.
              # Node exporter owns host traffic; retain CNI, Multus and VPN interfaces.
              - action: drop
                if: '{__name__=~"container_network_.+",pod=""}'
              - action: drop
                if: '{__name__=~"container_network_.+",interface!~"(eth|net|lan|iot|tun|tap|wg)[0-9]+"}'
        # cAdvisor supplies the container CPU and memory metrics used by our rules.
        resources:
          enabled: false
        probes:
          spec:
            # Keep failure counters for transient readiness/startup diagnostics.
            metricRelabelConfigs:
              - action: labeldrop
                regex: (uid|id|name)
              - action: drop
                source_labels: [__name__]
                regex: 'prober_probe_duration_seconds_(bucket|sum|count)'
    victoria-metrics-operator:
      enabled: true
      crds:
        cleanup:
          resources:
            limits:
              cpu: null
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
    prometheus-node-exporter:
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
      vmScrape:
        spec:
          endpoints:
            # Readiness and metadata used by workload joins follow the default 60s.
            - port: http
              honorLabels: true
              metricRelabelConfigs:
                - action: labeldrop
                  regex: (uid|container_id|image_id)
                - action: drop
                  source_labels: [__name__]
                  regex: '(kube_(namespace|deployment|statefulset|daemonset|networkpolicy|service|configmap|secret|persistentvolume|persistentvolumeclaim)_created|kube_endpointslice_info)'
            - port: http
              honorLabels: true
              interval: 2m
              relabelConfigs:
                - target_label: job
                  replacement: kube-state-metrics-inventory
              metricRelabelConfigs:
                - action: labeldrop
                  regex: (uid|container_id|image_id)
                - action: keep
                  source_labels: [__name__]
                  regex: '(kube_(namespace|deployment|statefulset|daemonset|networkpolicy|service|configmap|secret|persistentvolume|persistentvolumeclaim)_created|kube_endpointslice_info)'
      rbac:
        extraRules:
          - apiGroups: [kopiur.home-operations.com]
            resources: [maintenances, repositoryreplications, snapshotschedules]
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: kopiur.home-operations.com
                  version: v1alpha1
                  kind: Maintenance
                metricNamePrefix: homelab_kopiur
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: maintenance_created
                    help: Creation timestamp of a Kopiur maintenance resource.
                    each:
                      type: Gauge
                      gauge:
                        path: [metadata, creationTimestamp]
                  - name: maintenance_full_last_success_timestamp_seconds
                    help: Last successful full maintenance timestamp.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, full, lastRunAt]
                        nilIsZero: true
                  - name: maintenance_full_failures
                    help: Consecutive failed full maintenance runs.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, full, consecutiveFailures]
                        nilIsZero: true
                  - name: maintenance_quick_failures
                    help: Consecutive failed quick maintenance runs.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, quick, consecutiveFailures]
                        nilIsZero: true
              - groupVersionKind:
                  group: kopiur.home-operations.com
                  version: v1alpha1
                  kind: RepositoryReplication
                metricNamePrefix: homelab_kopiur
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: replication_last_success_timestamp_seconds
                    help: Last successful offsite replication timestamp.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, lastReplicated]
                        nilIsZero: true
              - groupVersionKind:
                  group: kopiur.home-operations.com
                  version: v1alpha1
                  kind: SnapshotSchedule
                metricNamePrefix: homelab_kopiur
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: schedule_created
                    help: Creation timestamp of a Kopiur snapshot schedule.
                    each:
                      type: Gauge
                      gauge:
                        path: [metadata, creationTimestamp]
                  - name: schedule_suspended
                    help: Whether a Kopiur snapshot schedule is suspended.
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, schedule, suspend]
                        nilIsZero: true
