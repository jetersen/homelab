# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmprobe_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: nas-tcp
spec:
  jobName: nas-tcp
  module: tcp_connect
  interval: 2m
  scrapeTimeout: 10s
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      targets:
      - 192.168.1.2:443
      - 192.168.1.2:2049
---
