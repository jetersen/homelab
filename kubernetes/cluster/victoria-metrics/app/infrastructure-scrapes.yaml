apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: external-dns
spec:
  namespaceSelector:
    matchNames:
    - external-dns
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  endpoints:
  - port: http
    path: /metrics
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: envoy-gateway
spec:
  namespaceSelector:
    matchNames:
    - kube-system
  selector:
    matchLabels:
      control-plane: envoy-gateway
  endpoints:
  - port: metrics
    path: /metrics
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
