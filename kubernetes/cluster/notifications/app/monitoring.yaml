apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: chaski
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: chaski
  endpoints:
    - port: metrics
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: notifications
spec:
  groups:
    - name: homelab.notifications
      rules:
        - alert: NotificationRelayFailed
          expr: sum(increase(chaski_target_sends_total{outcome=~"permanent|retryable"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Chaski could not deliver notifications
            description: Check Chaski target credentials, Home Assistant, and Gotify availability.
