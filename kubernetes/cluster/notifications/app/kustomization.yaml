apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - ntfy.yaml
  - gotify.yaml
  - gotify-auth.sops.yaml
  - chaski.yaml
  - source.yaml
  - auth.sops.yaml
  - monitoring.yaml
configMapGenerator:
  - name: ntfy-templates
    files:
      - homelab.yml=alertmanager-template.yml
    options:
      disableNameSuffixHash: true
components:
  - ../../../components/helmrelease-defaults
  - ../../../components/oci-source-defaults
