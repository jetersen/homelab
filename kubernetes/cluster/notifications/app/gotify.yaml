apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gotify
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      gotify:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: docker.io/gotify/server
              tag: 3.1.1@sha256:44fc5bbd1c0618878e33073d38c2c13126b48f245c3fe12236b1da48eb203b86
            env:
              TZ: Europe/Copenhagen
              GOTIFY_SERVER_PORT: '8080'
              GOTIFY_SERVER_SECURECOOKIE: 'true'
              GOTIFY_DATABASE_CONNECTION: /app/data/gotify.db
              GOTIFY_UPLOADEDIMAGESDIR: /app/data/images
              GOTIFY_PLUGINSDIR: ''
              GOTIFY_REGISTRATION: 'false'
              GOTIFY_DEFAULTUSER_NAME: jetersen
            envFrom:
            - secretRef:
                name: gotify-auth
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            probes:
              liveness: &id001
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
              readiness: *id001
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: gotify
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
        - gotify.jetersen.dev
        parentRefs:
        - name: envoy-proxy
          namespace: kube-system
          sectionName: https
        rules:
        - backendRefs:
          - identifier: app
            port: 8080
          timeouts:
            request: 0s
            backendRequest: 0s
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: local-path
        size: 1Gi
        retain: true
        globalMounts:
        - path: /app/data
