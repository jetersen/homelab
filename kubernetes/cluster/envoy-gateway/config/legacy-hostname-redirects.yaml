---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dns-legacy-redirect
spec:
  hostnames:
  - dns.lan.jetersen.dev
  parentRefs:
  - name: envoy-proxy
    namespace: kube-system
    sectionName: https
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        hostname: dns.jetersen.dev
        port: 443
        statusCode: 308
