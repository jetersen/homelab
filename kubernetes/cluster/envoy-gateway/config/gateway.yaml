---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-proxy
  annotations:
    # Public tier must override: this Gateway's own address is private and must
    # never be published. Routes opt in via public.external-dns.../enabled.
    public.external-dns.alpha.kubernetes.io/target: public.jetersen.dev
    # The internal tier needs no target annotation: both providers derive the
    # address from .status.addresses, so it tracks lbipam.cilium.io/ips rather
    # than being hardcoded a second time.
    towonel.io/gateway-service: kube-system/envoy-proxy:443
spec:
  gatewayClassName: envoy-proxy
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: 192.168.1.20
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: jetersen-dev-production-tls
            namespace: kube-system
          - kind: Secret
            name: lan-jetersen-dev-production-tls
            namespace: kube-system
