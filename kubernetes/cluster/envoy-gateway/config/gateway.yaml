---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-proxy
  annotations:
    # Public tier must override: this Gateway's own address is private and must
    # never be published. Routes opt in via public.external-dns.../enabled.
    public.external-dns.kubernetes.io/target: public.jetersen.dev
    # Internal providers derive both LAN VIPs from .status.addresses. Tailnet
    # clients reach them through Talos's native Tailscale host routes.
    towonel.io/gateway-service: kube-system/envoy-proxy:443
spec:
  gatewayClassName: envoy-proxy
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: 192.168.1.20,fde2:b84e:c4cd:1::1000
  listeners:
    - name: forgejo-ssh
      protocol: TCP
      port: 22
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: jetersen-dev-production-tls
            namespace: kube-system
          - kind: Secret
            name: lan-jetersen-dev-production-tls
            namespace: kube-system
