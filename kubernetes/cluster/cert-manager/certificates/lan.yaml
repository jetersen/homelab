---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lan-jetersen-dev
  namespace: cert-manager
spec:
  secretName: lan-jetersen-dev-production-tls
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: kube-system
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: kube-system
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "*.lan.jetersen.dev"
  dnsNames:
    - "lan.jetersen.dev"
    - "*.lan.jetersen.dev"
  privateKey:
    algorithm: ECDSA
    # Envoy's QUIC listener requires the P-256 curve.
    size: 256
