apiVersion: v1
kind: Namespace
metadata:
  name: home-assistant
  annotations:
    kopiur.home-operations.com/privileged-movers: "true"
  labels:
    name: home-assistant
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
