  path: ./kubernetes/apps/home-assistant/backup

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wol-relay
  namespace: flux-system
  labels:
    homelab.jetersen.dev/flux-defaults: enabled
    homelab.jetersen.dev/flux-homelab-source: enabled
    homelab.jetersen.dev/flux-wait: enabled
spec:
  targetNamespace: home-assistant
  dependsOn:
    - name: multus
  path: ./kubernetes/apps/home-assistant/wol-relay
