apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: home-assistant-backup
spec:
  backend:
    filesystem:
      path: /mnt/nas-repository
      volume:
        pvc:
          name: home-assistant-nas-backup
  encryption:
    passwordSecretRef:
      name: home-assistant-kopia-nas
      key: KOPIA_PASSWORD
  create:
    enabled: false
  mode: ReadWrite
  catalog:
    adoption: Ignore
    periodicRefresh: true
    refreshInterval: 1h
  scheduleDefaults:
    timezone: Etc/UTC
  concurrency:
    maxConcurrentJobs: 1
  moverDefaults:
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi
    cache:
      capacity: 1Gi
      metadataCacheSizeMb: 64
      contentCacheSizeMb: 128
    ttlSecondsAfterFinished: 3600
  maintenance:
    enabled: true
    takeoverPolicy: Force
    schedule:
      quick:
        cron: 0 */6 * * *
        jitter: 0s
      full:
        cron: 0 10 * * *
        jitter: 0s
      timezone: Etc/UTC
---
