apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: home-assistant-backup
spec:
  repository:
    kind: Repository
    name: home-assistant-backup
  identity:
    username: home-assistant
    hostname: homelab
  sources:
  - pvc:
      name: home-assistant-backup-exports
    sourcePathOverride: /data
  copyMethod: Direct
  defaultDeletionPolicy: Delete
  adoption: Ignore
  retention:
    keepLatest: 3
    keepHourly: 0
    keepDaily: 0
    keepWeekly: 0
    keepMonthly: 0
    keepAnnual: 0
  files:
    ignoreRules: []
    ignoreCacheDirs: false
  extraArgs:
  - --inherit=false
  - --clear-ignore
  - --clear-dot-ignore
  - --keep-latest=2147483647
  - --keep-hourly=0
  - --keep-daily=0
  - --keep-weekly=0
  - --keep-monthly=0
  - --keep-annual=0
  errorHandling:
    failFast: true
  hooks:
    beforeSnapshot:
    - runJob:
        timeout: 5m
        jobSpec:
          backoffLimit: 0
          activeDeadlineSeconds: 240
          template:
            spec:
              automountServiceAccountToken: false
              restartPolicy: Never
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                seccompProfile:
                  type: RuntimeDefault
              containers:
              - name: export
                image: docker.io/library/python:3.14.8-slim@sha256:89fb7d3da20043c370643435258bdd7ab755d326d359001d02988ed15ae5219e
                command:
                - python3
                - /scripts/stage-home-assistant.py
                env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: '1'
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                    - ALL
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    memory: 512Mi
                volumeMounts:
                - name: config
                  mountPath: /data
                  readOnly: true
                - name: exports
                  mountPath: /exports
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: temporary
                  mountPath: /tmp
              volumes:
              - name: config
                persistentVolumeClaim:
                  claimName: home-assistant-pvc
              - name: exports
                persistentVolumeClaim:
                  claimName: home-assistant-backup-exports
              - name: script
                configMap:
                  name: home-assistant-backup-export-script
              - name: temporary
                emptyDir:
                  medium: Memory
                  sizeLimit: 256Mi
          ttlSecondsAfterFinished: 3600
  verification:
    verifyFilesPercent: 100
    quick:
      schedule:
        cron: 0 9 * * *
        jitter: 0s
    successExpr: stats.files > 0 && stats.errors == 0
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: home-assistant-backup
spec:
  policyRef:
    name: home-assistant-backup
  schedule:
    cron: 0 7 * * *
    timezone: Etc/UTC
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 2
  deletion:
    onScheduleDelete: Retain
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: RepositoryReplication
metadata:
  name: home-assistant-offsite
spec:
  sourceRef:
    kind: Repository
    name: home-assistant-backup
  destination:
    s3:
      bucket: jetersen-homelab-kopia
      prefix: pilot/home-assistant/
      endpoint: s3.de.io.cloud.ovh.net
      region: de
      auth:
        secretRef:
          name: home-assistant-kopia
  schedule:
    cron: 40 * * * *
    timezone: Etc/UTC
    jitter: 0s
  sync:
    parallel: 4
    deleteExtra: true
    mustExist: true
    update: true
---
