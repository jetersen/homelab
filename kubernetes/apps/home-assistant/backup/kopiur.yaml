apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: zigbee2mqtt-backup
spec:
  repository:
    kind: Repository
    name: zigbee2mqtt-backup
  identity:
    username: zigbee2mqtt
    hostname: homelab
  sources:
  - pvc:
      name: zigbee-backup-exports
    sourcePathOverride: /data
  copyMethod: Direct
  defaultDeletionPolicy: Delete
  adoption: Ignore
  retention:
    keepLatest: 1
    keepHourly: 0
    keepDaily: 14
    keepWeekly: 8
    keepMonthly: 6
    keepAnnual: 0
  files:
    ignoreRules: []
    ignoreCacheDirs: false
  extraArgs:
  - --inherit=false
  - --clear-ignore
  - --clear-dot-ignore
  - --keep-latest=2147483647
  - --keep-hourly=0
  - --keep-daily=0
  - --keep-weekly=0
  - --keep-monthly=0
  - --keep-annual=0
  errorHandling:
    failFast: true
  hooks:
    beforeSnapshot:
    - runJob:
        timeout: 5m
        jobSpec:
          backoffLimit: 0
          activeDeadlineSeconds: 240
          template:
            spec:
              automountServiceAccountToken: false
              restartPolicy: Never
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                seccompProfile:
                  type: RuntimeDefault
              containers:
              - name: export
                image: docker.io/koenkk/zigbee2mqtt:2.14.2@sha256:addbfb08fcef2e4477de1535636118241e10d13e898fbe4d9faba8a4d7396311
                command:
                - node
                - /scripts/export-zigbee.cjs
                env:
                - name: MQTT_SERVER
                  value: mqtt://mosquitto:1883
                - name: NODE_PATH
                  value: /app/node_modules
                - name: ZIGBEE2MQTT_CONFIG_MQTT_SERVER
                  value: mqtt://mosquitto:1883
                - name: ZIGBEE2MQTT_CONFIG_MQTT_CLIENT_ID
                  value: zigbee2mqtt
                - name: ZIGBEE2MQTT_CONFIG_MQTT_BASE_TOPIC
                  value: zigbee2mqtt
                - name: ZIGBEE2MQTT_CONFIG_SERIAL_PORT
                  value: tcp://192.168.1.9:6638
                - name: ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER
                  value: zstack
                - name: ZIGBEE2MQTT_CONFIG_SERIAL_BAUDRATE
                  value: '115200'
                - name: ZIGBEE2MQTT_CONFIG_SERIAL_RTSCTS
                  value: 'false'
                - name: ZIGBEE2MQTT_CONFIG_ADVANCED_CHANNEL
                  value: '25'
                - name: ZIGBEE2MQTT_CONFIG_ADVANCED_TRANSMIT_POWER
                  value: '20'
                - name: ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED
                  value: 'true'
                - name: ZIGBEE2MQTT_CONFIG_MQTT_USER
                  valueFrom:
                    secretKeyRef:
                      name: zigbee2mqtt
                      key: mqttUser
                - name: ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: zigbee2mqtt
                      key: mqttPassword
                - name: ZIGBEE2MQTT_CONFIG_ADVANCED_NETWORK_KEY
                  valueFrom:
                    secretKeyRef:
                      name: zigbee2mqtt
                      key: zigbeeNetworkKey
                - name: ZIGBEE2MQTT_CONFIG_ADVANCED_PAN_ID
                  valueFrom:
                    secretKeyRef:
                      name: zigbee2mqtt
                      key: zigbeePanId
                - name: ZIGBEE2MQTT_CONFIG_ADVANCED_EXT_PAN_ID
                  valueFrom:
                    secretKeyRef:
                      name: zigbee2mqtt
                      key: zigbeeExtPanId
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                    - ALL
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    memory: 256Mi
                volumeMounts:
                - name: exports
                  mountPath: /exports
                - name: script
                  mountPath: /scripts
                  readOnly: true
              volumes:
              - name: exports
                persistentVolumeClaim:
                  claimName: zigbee-backup-exports
              - name: script
                configMap:
                  name: zigbee-backup-export-script
          ttlSecondsAfterFinished: 3600
  verification:
    verifyFilesPercent: 100
    quick:
      schedule:
        cron: 0 9 * * *
        jitter: 0s
    successExpr: stats.files > 0 && stats.errors == 0
---
