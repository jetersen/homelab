apiVersion: v1
kind: ServiceAccount
metadata:
  name: application-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: application-backup
rules:
- apiGroups:
  - volsync.backube
  resources:
  - replicationsources
  resourceNames:
  - home-assistant-backup
  - zigbee2mqtt-backup
  verbs:
  - get
  - patch
- apiGroups:
  - batch
  resources:
  - cronjobs
  resourceNames:
  - zigbee-backup-export
  verbs:
  - get
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: application-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: application-backup
subjects:
- kind: ServiceAccount
  name: application-backup
  namespace: home-assistant
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: home-assistant-backup
spec:
  suspend: false
  schedule: 0 7 * * *
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 2400
      template:
        spec:
          serviceAccountName: application-backup
          restartPolicy: Never
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: backup
            image: ghcr.io/perfectra1n/volsync:0.17.11@sha256:79674d3c48685e21cadaac8e0afd14268130a0a51a10c41a9dd65096c1434a0f
            command:
            - python3
            - /scripts/run-backup.py
            - home-assistant-backup
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 20m
                memory: 32Mi
              limits:
                memory: 128Mi
            volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          volumes:
          - name: script
            configMap:
              name: application-backup-runner
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: home-assistant-backup-maintenance
spec:
  suspend: false
  schedule: 0 10 * * *
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: maintenance
            image: ghcr.io/perfectra1n/volsync:0.17.11@sha256:79674d3c48685e21cadaac8e0afd14268130a0a51a10c41a9dd65096c1434a0f
            command:
            - /bin/bash
            - /mover-kopia/entry.sh
            envFrom:
            - secretRef:
                name: home-assistant-kopia
            env:
            - name: DIRECTION
              value: maintenance
            - name: KOPIA_CACHE_DIR
              value: /cache
            - name: KOPIA_CONFIG_PATH
              value: /kopia-config
            - name: KOPIA_OVERRIDE_USERNAME
              value: home-assistant
            - name: KOPIA_OVERRIDE_HOSTNAME
              value: homelab
            - name: KOPIA_OVERRIDE_MAINTENANCE_USERNAME
              value: home-assistant@homelab
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 1Gi
            volumeMounts:
            - name: cache
              mountPath: /cache
          volumes:
          - name: cache
            emptyDir:
              sizeLimit: 1Gi
---
