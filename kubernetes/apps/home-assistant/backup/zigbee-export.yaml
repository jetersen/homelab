apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zigbee-backup-exports
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zigbee-backup-export
spec:
  suspend: true
  schedule: 0 6 * * *
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: export
            image: docker.io/koenkk/zigbee2mqtt:2.14.2@sha256:addbfb08fcef2e4477de1535636118241e10d13e898fbe4d9faba8a4d7396311
            command:
            - node
            - /scripts/export-zigbee.cjs
            env:
            - name: MQTT_SERVER
              value: mqtt://mosquitto.home-assistant.svc.cluster.local:1883
            - name: NODE_PATH
              value: /app/node_modules
            - name: ZIGBEE2MQTT_CONFIG_MQTT_SERVER
              value: mqtt://mosquitto:1883
            - name: ZIGBEE2MQTT_CONFIG_MQTT_CLIENT_ID
              value: zigbee2mqtt
            - name: ZIGBEE2MQTT_CONFIG_MQTT_BASE_TOPIC
              value: zigbee2mqtt
            - name: ZIGBEE2MQTT_CONFIG_SERIAL_PORT
              value: tcp://192.168.1.9:6638
            - name: ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER
              value: zstack
            - name: ZIGBEE2MQTT_CONFIG_SERIAL_BAUDRATE
              value: '115200'
            - name: ZIGBEE2MQTT_CONFIG_SERIAL_RTSCTS
              value: 'false'
            - name: ZIGBEE2MQTT_CONFIG_ADVANCED_CHANNEL
              value: '25'
            - name: ZIGBEE2MQTT_CONFIG_ADVANCED_TRANSMIT_POWER
              value: '20'
            - name: ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED
              value: 'true'
            - name: ZIGBEE2MQTT_CONFIG_MQTT_USER
              valueFrom:
                secretKeyRef:
                  name: zigbee2mqtt
                  key: mqttUser
            - name: ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zigbee2mqtt
                  key: mqttPassword
            - name: ZIGBEE2MQTT_CONFIG_ADVANCED_NETWORK_KEY
              valueFrom:
                secretKeyRef:
                  name: zigbee2mqtt
                  key: zigbeeNetworkKey
            - name: ZIGBEE2MQTT_CONFIG_ADVANCED_PAN_ID
              valueFrom:
                secretKeyRef:
                  name: zigbee2mqtt
                  key: zigbeePanId
            - name: ZIGBEE2MQTT_CONFIG_ADVANCED_EXT_PAN_ID
              valueFrom:
                secretKeyRef:
                  name: zigbee2mqtt
                  key: zigbeeExtPanId
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            volumeMounts:
            - name: exports
              mountPath: /exports
            - name: script
              mountPath: /scripts
              readOnly: true
          volumes:
          - name: exports
            persistentVolumeClaim:
              claimName: zigbee-backup-exports
          - name: script
            configMap:
              name: zigbee-backup-export-script
