apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant
resources:
- zigbee-export.yaml
- home-assistant-secret.sops.yaml
- home-assistant-nas-secret.sops.yaml
- zigbee2mqtt-secret.sops.yaml
- zigbee2mqtt-nas-secret.sops.yaml
- nas-storage.sops.yaml
- kopiur.yaml
- home-assistant-export.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
- name: home-assistant-backup-export-script
  files:
  - stage-home-assistant.py
- name: zigbee-backup-export-script
  files:
  - export-zigbee.cjs
