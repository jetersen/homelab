template:
  - binary_sensor:
      - name: Music headphones playback
        unique_id: music_headphones_playback
        default_entity_id: binary_sensor.music_headphones_playback
        state: >-
          {{ is_state('media_player.my_phone', 'playing') and
             'WH-1000XM6' in (state_attr('sensor.cph2709_bluetooth_connection',
             'connected_paired_devices') or []) | join(' ') }}
        # Android can pause or stop audio before reporting the Bluetooth disconnection.
        delay_off: "00:00:10"

script:
  music_headphones_return:
    alias: Return headphone music to Rocket at home
    mode: single
    sequence:
      - &music_return_allowed
        condition: and
        conditions:
          - condition: state
            entity_id: input_boolean.at_home
            state: "on"
          - condition: state
            entity_id: binary_sensor.rocket_sensor_power
            state: "on"
          - condition: state
            entity_id: binary_sensor.music_headphones_playback
            state: "on"
          - condition: template
            value_template: >-
              {{ has_value('sensor.cph2709_bluetooth_connection') and
                 state_attr('sensor.cph2709_bluetooth_connection', 'connected_paired_devices') is not none and
                 'WH-1000XM6' not in (state_attr('sensor.cph2709_bluetooth_connection',
                 'connected_paired_devices') or []) | join(' ') and
                 states('media_player.my_phone') in ['playing', 'paused', 'idle'] and
                 states('media_player.rocket') in ['idle', 'paused', 'playing'] }}
      - action: music_assistant.get_queue
        target:
          entity_id: media_player.my_phone
        response_variable: phone_queue
      - condition: template
        value_template: "{{ phone_queue.get('media_player.my_phone', {}).get('items', 0) > 0 }}"
      - *music_return_allowed
      - variables:
          rocket_volume: "{{ state_attr('media_player.rocket', 'volume_level') }}"
      - condition: template
        value_template: "{{ is_number(rocket_volume) }}"
      - if: "{{ rocket_volume | float > 0.4 }}"
        then:
          - action: media_player.volume_set
            target:
              entity_id: media_player.rocket
            data:
              volume_level: 0.4
      - wait_template: >-
          {{ is_number(state_attr('media_player.rocket', 'volume_level')) and
             state_attr('media_player.rocket', 'volume_level') | float <= 0.4 }}
        timeout: "00:00:05"
        continue_on_timeout: false
      - variables:
          music_deadline: "{{ as_timestamp(now()) + 5 }}"
          music_request: "music-{{ (as_timestamp(now()) * 1000000) | int }}"
      - action: mqtt.publish
        data:
          topic: rocket/audio/music/set
          payload: >-
            {{ dict(request_id=music_request,
                    expires_at=music_deadline | float) | to_json }}
          qos: 1
          retain: false
      - wait_template: >-
          {{ state_attr('number.rocket_speaker_volume', 'request_id') == music_request }}
        timeout: "00:00:03"
        continue_on_timeout: false
      - &speaker_volume_confirmed
        condition: template
        value_template: >-
          {{ state_attr('number.rocket_speaker_volume', 'request_id') == music_request and
             is_state_attr('number.rocket_speaker_volume', 'limit_ok', true) and
             as_timestamp(now()) < music_deadline | float(0) }}
      - if: "{{ is_state_attr('media_player.rocket', 'is_volume_muted', true) }}"
        then:
          - action: media_player.volume_mute
            target:
              entity_id: media_player.rocket
            data:
              is_volume_muted: false
      - wait_template: "{{ is_state_attr('media_player.rocket', 'is_volume_muted', false) }}"
        timeout: "00:00:03"
        continue_on_timeout: false
      - *music_return_allowed
      - *speaker_volume_confirmed
      - condition: template
        value_template: >-
          {{ is_number(state_attr('media_player.rocket', 'volume_level')) and
             state_attr('media_player.rocket', 'volume_level') | float <= 0.4 }}
      - action: music_assistant.transfer_queue
        target:
          entity_id: media_player.rocket
        data:
          source_player: media_player.my_phone
          auto_play: true

  music_headphones_prompt:
    alias: Music headphones prompt
    mode: restart
    sequence:
      - action: notify.mobile_app_oneplus_nord_5
        data:
          title: WH-1000XM6 connected
          message: Resume your phone queue or bring your desktop music with you.
          data:
            tag: music-headphones
            channel: Music
            notification_icon: mdi:headphones
            ttl: 0
            priority: high
            timeout: 300
            clickAction: deep-link://musicassistant://app/players?player=My%20Phone
            actions:
              - action: MUSIC_HEADPHONES_RESUME
                title: Resume phone
              - action: MUSIC_HEADPHONES_TRANSFER
                title: Transfer desktop
              - action: URI
                title: Open app
                uri: deep-link://musicassistant://app/players?player=My%20Phone

  music_headphones_fill_queue:
    alias: Start a playlist or recent-track radio for headphones
    mode: single
    sequence:
      - repeat:
          for_each: [playlist, track]
          sequence:
            - &headphones_connected
              condition: template
              value_template: >-
                {{ 'WH-1000XM6' in (state_attr('sensor.cph2709_bluetooth_connection',
                   'connected_paired_devices') or []) | join(' ') }}
            - variables:
                library_result: {}
            - action: music_assistant.get_library
              data:
                config_entry_id: "{{ config_entry_id('media_player.my_phone') }}"
                media_type: "{{ repeat.item }}"
                order_by: last_played_desc
                limit: 1
              response_variable: library_result
              continue_on_error: true
            - variables:
                fallback_uri: >-
                  {{ (library_result | default({})).get('items', [])
                     | selectattr('uri', 'defined') | map(attribute='uri')
                     | first | default('') }}
            - if: "{{ fallback_uri != '' }}"
              then:
                # Keep music the user selected while the library was loading.
                - action: music_assistant.get_queue
                  target:
                    entity_id: media_player.my_phone
                  response_variable: current_queue
                - if: "{{ current_queue['media_player.my_phone']['items'] > 0 }}"
                  then:
                    - stop: Phone queue already populated
                - *headphones_connected
                - action: music_assistant.play_media
                  target:
                    entity_id: media_player.my_phone
                  data:
                    media_id: "{{ fallback_uri }}"
                    media_type: "{{ repeat.item }}"
                    enqueue: play
                    radio_mode: "{{ repeat.item == 'track' }}"
                  continue_on_error: true
                - action: music_assistant.get_queue
                  target:
                    entity_id: media_player.my_phone
                  response_variable: current_queue
                - if: "{{ current_queue['media_player.my_phone']['items'] > 0 }}"
                  then:
                    - stop: Headphone music started

  music_headphones_play:
    alias: Play music through connected headphones
    mode: single
    fields:
      operation:
        required: true
        selector:
          select:
            options: [resume, transfer, handoff]
    sequence:
      - *headphones_connected
      - action: notify.mobile_app_oneplus_nord_5
        data:
          message: command_activity
          data:
            intent_action: android.intent.action.VIEW
            intent_package_name: io.music_assistant.client
            intent_uri: musicassistant://app/players?player=My%20Phone
            ttl: 0
            priority: high
      - wait_template: "{{ has_value('media_player.my_phone') }}"
        timeout: "00:00:30"
        continue_on_timeout: true
      # The headphones may disconnect while Android starts the player.
      - condition: template
        value_template: >-
          {{ 'WH-1000XM6' in (state_attr('sensor.cph2709_bluetooth_connection',
             'connected_paired_devices') or []) | join(' ') }}
      - variables:
          problem: ""
          # Resume the phone when away or during the weekday morning window.
          operation: >-
            {{ 'resume' if operation == 'handoff' and
               (is_state('input_boolean.at_home', 'off') or
                (now().weekday() < 5 and 6 <= now().hour < 10)) else operation }}
      - choose:
          - conditions: "{{ not has_value('media_player.my_phone') }}"
            sequence:
              - variables:
                  problem: Open Music Assistant to reconnect the phone, then try again.
        default:
          - choose:
              - conditions: "{{ operation == 'resume' }}"
                sequence:
                  - action: music_assistant.get_queue
                    target:
                      entity_id: media_player.my_phone
                    response_variable: phone_queue
                  - if: "{{ phone_queue['media_player.my_phone']['items'] > 0 }}"
                    then:
                      - *headphones_connected
                      - action: media_player.media_play
                        target:
                          entity_id: media_player.my_phone
                    else:
                      - action: script.music_headphones_fill_queue
                      - action: music_assistant.get_queue
                        target:
                          entity_id: media_player.my_phone
                        response_variable: phone_queue
                      - if: "{{ phone_queue['media_player.my_phone']['items'] == 0 }}"
                        then:
                          - variables:
                              problem: Your phone queue is empty, and no playlist or recent track could be started. Open Music Assistant to choose music.
              - conditions: "{{ operation in ['transfer', 'handoff'] }}"
                sequence:
                  - action: music_assistant.get_queue
                    target:
                      entity_id: media_player.rocket
                    response_variable: rocket_queue
                    continue_on_error: true
                  - action: music_assistant.get_queue
                    target:
                      entity_id: media_player.framework
                    response_variable: framework_queue
                    continue_on_error: true
                  - variables:
                      source: >-
                        {% set queues = dict(rocket_queue | default({}),
                                             **(framework_queue | default({}))) %}
                        {% set candidates = namespace(playing=[], other=[]) %}
                        {% for entity in ['media_player.rocket', 'media_player.framework'] %}
                          {% if has_value(entity) and queues.get(entity, {}).get('items', 0) > 0 %}
                            {% if is_state(entity, 'playing') %}
                              {% set candidates.playing = candidates.playing + [entity] %}
                            {% elif operation == 'transfer' %}
                              {% set candidates.other = candidates.other + [entity] %}
                            {% endif %}
                          {% endif %}
                        {% endfor %}
                        {{ (candidates.playing + candidates.other) | first | default('') }}
                  - if: "{{ source != '' }}"
                    then:
                      - action: music_assistant.transfer_queue
                        target:
                          entity_id: media_player.my_phone
                        data:
                          source_player: "{{ source }}"
                          auto_play: true
                    else:
                      - if: "{{ operation == 'handoff' }}"
                        then:
                          - action: script.music_headphones_prompt
                        else:
                          - variables:
                              problem: Neither desktop has an available music queue. Open Music Assistant to choose music.
      - if: "{{ problem != '' }}"
        then:
          - *headphones_connected
          - action: notify.mobile_app_oneplus_nord_5
            data:
              title: Music Assistant
              message: "{{ problem }}"
              data:
                tag: music-headphones-help
                channel: Music
                notification_icon: mdi:headphones
                clickAction: deep-link://musicassistant://app/players?player=My%20Phone
                actions:
                  - action: URI
                    title: Open app
                    uri: deep-link://musicassistant://app/players?player=My%20Phone

automation:
  - id: music_headphones_connected
    alias: Open music and transfer active desktop playback when headphones connect
    mode: restart
    triggers:
      - trigger: template
        value_template: >-
          {{ 'WH-1000XM6' in (state_attr('sensor.cph2709_bluetooth_connection',
             'connected_paired_devices') or []) | join(' ') }}
        for: "00:00:02"
    actions:
      - action: script.music_headphones_play
        data:
          operation: handoff

  - id: music_headphones_disconnected
    alias: Clear music prompt and return playback when headphones disconnect
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.cph2709_bluetooth_connection
        attribute: connected_paired_devices
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.to_state is not none and
             trigger.from_state.state not in ['unknown', 'unavailable'] and
             trigger.to_state.state not in ['unknown', 'unavailable'] and
             trigger.to_state.attributes.get('connected_paired_devices') is not none and
             'WH-1000XM6' in (trigger.from_state.attributes.get('connected_paired_devices') or []) | join(' ') and
             'WH-1000XM6' not in (trigger.to_state.attributes.get('connected_paired_devices') or []) | join(' ') }}
    actions:
      - repeat:
          for_each: [music-headphones, music-headphones-help]
          sequence:
            - action: notify.mobile_app_oneplus_nord_5
              data:
                message: clear_notification
                data:
                  tag: "{{ repeat.item }}"
      - action: script.music_headphones_return

  - id: music_headphones_notification_action
    alias: Handle headphone music notification
    mode: single
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: MUSIC_HEADPHONES_RESUME
          tag: music-headphones
        id: resume
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: MUSIC_HEADPHONES_TRANSFER
          tag: music-headphones
        id: transfer
    actions:
      - action: script.music_headphones_play
        data:
          operation: "{{ trigger.id }}"
