---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  upgrade:
    force: true
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      # LAN discovery (zeroconf, SSDP) and Wake-on-LAN broadcasts need the host network.
      hostNetwork: true
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      home-assistant:
        strategy: Recreate
        annotations:
          configmap.reloader.stakater.com/reload: home-assistant-notifications
        containers:
          app:
            resources:
              requests:
                cpu: 25m
            nameOverride: home-assistant
            # Rootless build; custom integration requirements install into /config/.venv.
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.9.4@sha256:cd5ffc0a3bc873b35f20189ef22ee7ee9e8875fe666928dfee263cd464cc053d
              pullPolicy: IfNotPresent
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            ports:
              - name: http
                containerPort: 8123
                hostPort: 8123
                protocol: TCP
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                    scheme: HTTP
                  periodSeconds: 20
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                    scheme: HTTP
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123
            targetPort: 8123
    persistence:
      config:
        existingClaim: home-assistant-pvc-lvm
        type: persistentVolumeClaim
        advancedMounts:
          home-assistant:
            app:
              - path: /config
      notifications:
        type: configMap
        name: home-assistant-notifications
        advancedMounts:
          home-assistant:
            app:
              - path: /config/gitops-packages
                readOnly: true
      glkvm-tls:
        type: secret
        name: glkvm-tls
        advancedMounts:
          home-assistant:
            app:
              - path: /etc/glkvm/tls
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          home-assistant:
            app:
              - path: /tmp
      glkvm-auth:
        type: secret
        name: glkvm-auth
        advancedMounts:
          home-assistant:
            app:
              - path: /etc/glkvm/auth
                readOnly: true
