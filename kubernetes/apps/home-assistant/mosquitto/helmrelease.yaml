---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1883
        runAsGroup: 1883
        runAsNonRoot: true
        fsGroup: 1883
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      mosquitto:
        # A single broker owns the persisted message store.
        strategy: Recreate
        annotations:
          secret.reloader.stakater.com/reload: mqtt-auth
        initContainers:
          password-file:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command:
              - sh
              - -ec
              - |
                umask 077
                cp /mqtt-auth/passwd /mosquitto/secrets/passwd
                chmod 0600 /mosquitto/secrets/passwd
                while IFS=: read -r username hash; do
                  [ -n "$username" ] || continue
                  printf 'user %s\n' "$username"
                  if [ "$username" = nixos-deploy-ci ]; then
                    printf 'topic write framework/button/update/command\n'
                    printf 'topic write rocket/button/update/command\n'
                  elif [ "$username" = home-assistant ]; then
                    printf 'topic readwrite #\n'
                    # Preserve other integrations; deployment updates belong to CI.
                    printf 'topic deny +/button/update/command\n'
                  elif [ "$username" = pc2mqtt-rocket ]; then
                    printf 'topic write rocket/state\n'
                    printf 'topic write rocket/binary_sensor/availability\n'
                    printf 'topic write homeassistant/binary_sensor/63fbeebb-f107-4903-ab36-6104b9d802b0/rocket_sensor_power/config\n'
                    printf 'topic write homeassistant/button/63fbeebb-f107-4903-ab36-6104b9d802b0/rocket_button_shutdown/config\n'
                    printf 'topic write homeassistant/button/63fbeebb-f107-4903-ab36-6104b9d802b0/rocket_button_reboot/config\n'
                    printf 'topic read rocket/button/shutdown/command\n'
                    printf 'topic read rocket/button/reboot/command\n'
                    printf 'topic read rocket/button/update/command\n'
                  elif [ "$username" = pc2mqtt-framework ]; then
                    printf 'topic write framework/state\n'
                    printf 'topic write framework/binary_sensor/availability\n'
                    printf 'topic write homeassistant/binary_sensor/fbce0afd-c66f-4a56-b8aa-0e1561ac1837/framework_sensor_power/config\n'
                    printf 'topic write homeassistant/button/fbce0afd-c66f-4a56-b8aa-0e1561ac1837/framework_button_shutdown/config\n'
                    printf 'topic write homeassistant/button/fbce0afd-c66f-4a56-b8aa-0e1561ac1837/framework_button_reboot/config\n'
                    printf 'topic read framework/button/shutdown/command\n'
                    printf 'topic read framework/button/reboot/command\n'
                    printf 'topic read framework/button/update/command\n'
                  else
                    printf 'topic readwrite #\n'
                  fi
                done < /mqtt-auth/passwd > /mosquitto/secrets/acl
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 32Mi
        containers:
          app:
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            probes:
              startup:
                enabled: true
                type: TCP
                port: 1883
                spec:
                  periodSeconds: 2
                  failureThreshold: 30
              readiness:
                enabled: true
                type: TCP
                port: 1883
            resources:
              requests:
                cpu: 5m
            image:
              repository: docker.io/library/eclipse-mosquitto
              tag: 2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    service:
      app:
        controller: mosquitto
        type: ClusterIP
        ports:
          mqtt: { port: 1883, protocol: TCP, targetPort: 1883 }
          websocket: { port: 9001, protocol: TCP, targetPort: 9001 }
    persistence:
      config:
        type: configMap
        name: mosquitto
        advancedMounts:
          mosquitto:
            app:
              - path: /mosquitto/config
      data:
        existingClaim: mosquitto-lvm
        type: persistentVolumeClaim
        advancedMounts:
          mosquitto:
            app:
              - path: /mosquitto/data
      passwd:
        # Secret projections remain root-owned; copy as the broker UID at startup.
        type: secret
        name: mqtt-auth
        defaultMode: 288 # 0440; fsGroup permits the non-root init container to read it.
        advancedMounts:
          mosquitto:
            password-file:
              - path: /mqtt-auth
                readOnly: true
      private-passwd:
        type: emptyDir
        medium: Memory
        advancedMounts:
          mosquitto:
            password-file:
              - path: /mosquitto/secrets
            app:
              - path: /mosquitto/secrets
                readOnly: true
    configMaps:
      config:
        data:
          mosquitto.conf: |
            persistence true
            persistence_location /mosquitto/data
            log_dest stdout
            allow_anonymous false
            password_file /mosquitto/secrets/passwd
            acl_file /mosquitto/secrets/acl
            listener 1883
            listener 9001
            protocol websockets
