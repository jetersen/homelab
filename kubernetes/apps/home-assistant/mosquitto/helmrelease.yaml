---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    mqttClients:
      rocket: 63fbeebb-f107-4903-ab36-6104b9d802b0
      framework: fbce0afd-c66f-4a56-b8aa-0e1561ac1837
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1883
        runAsGroup: 1883
        runAsNonRoot: true
        fsGroup: 1883
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      mosquitto:
        # A single broker owns the persisted message store.
        strategy: Recreate
        annotations:
          secret.reloader.stakater.com/reload: mqtt-auth
        initContainers:
          password-file:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command:
              - sh
              - -ec
              - |
                umask 077
                cp /mqtt-auth/passwd /mosquitto/secrets/passwd
                cp /mosquitto/config/acl /mosquitto/secrets/acl
                chmod 0600 /mosquitto/secrets/passwd /mosquitto/secrets/acl
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 32Mi
        containers:
          app:
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            probes:
              startup:
                enabled: true
                type: TCP
                port: 1883
                spec:
                  periodSeconds: 2
                  failureThreshold: 30
              readiness:
                enabled: true
                type: TCP
                port: 1883
            resources:
              requests:
                cpu: 5m
            image:
              repository: docker.io/library/eclipse-mosquitto
              tag: 2.1.2-alpine@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    service:
      app:
        controller: mosquitto
        type: ClusterIP
        ports:
          mqtt: { port: 1883, protocol: TCP, targetPort: 1883 }
          websocket: { port: 9001, protocol: TCP, targetPort: 9001 }
    persistence:
      config:
        type: configMap
        name: mosquitto
        advancedMounts:
          mosquitto:
            app:
              - path: /mosquitto/config
            password-file:
              - path: /mosquitto/config
                readOnly: true
      data:
        existingClaim: mosquitto-lvm
        type: persistentVolumeClaim
        advancedMounts:
          mosquitto:
            app:
              - path: /mosquitto/data
      passwd:
        # Secret projections remain root-owned; copy as the broker UID at startup.
        type: secret
        name: mqtt-auth
        defaultMode: 288 # 0440; fsGroup permits the non-root init container to read it.
        advancedMounts:
          mosquitto:
            password-file:
              - path: /mqtt-auth
                readOnly: true
      private-passwd:
        type: emptyDir
        medium: Memory
        advancedMounts:
          mosquitto:
            password-file:
              - path: /mosquitto/secrets
            app:
              - path: /mosquitto/secrets
                readOnly: true
    configMaps:
      config:
        data:
          mosquitto.conf: |
            persistence true
            persistence_location /mosquitto/data
            log_dest stdout
            allow_anonymous false
            password_file /mosquitto/secrets/passwd
            acl_file /mosquitto/secrets/acl
            listener 1883
            listener 9001
            protocol websockets
          acl: |
            user mqtt
            topic readwrite #

            user home-assistant
            topic readwrite #
            topic deny +/button/update/command

            user nixos-deploy-ci
            topic write framework/button/update/command
            topic write rocket/button/update/command

            {{ range $host, $deviceId := .Values.mqttClients }}
            user pc2mqtt-{{ $host }}
            topic write {{ $host }}/state
            topic write {{ $host }}/binary_sensor/availability
            topic write homeassistant/binary_sensor/{{ $deviceId }}/{{ $host }}_sensor_power/config
            topic write homeassistant/button/{{ $deviceId }}/{{ $host }}_button_shutdown/config
            topic write homeassistant/button/{{ $deviceId }}/{{ $host }}_button_reboot/config
            topic read {{ $host }}/button/shutdown/command
            topic read {{ $host }}/button/reboot/command
            topic read {{ $host }}/button/update/command
            {{ end }}
