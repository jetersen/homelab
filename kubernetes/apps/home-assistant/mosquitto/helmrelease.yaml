---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
    controllers:
      mosquitto:
        containers:
          app:
            resources:
              requests:
                cpu: 5m
            image:
              repository: docker.io/library/eclipse-mosquitto
              tag: 2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    service:
      app:
        controller: mosquitto
        type: ClusterIP
        ports:
          mqtt: { port: 1883, protocol: TCP, targetPort: 1883 }
          websocket: { port: 9001, protocol: TCP, targetPort: 9001 }
    persistence:
      config:
        type: configMap
        name: mosquitto
        advancedMounts:
          mosquitto:
            app:
              - path: /mosquitto/config
      data:
        existingClaim: mosquitto-lvm
        type: persistentVolumeClaim
        advancedMounts:
          mosquitto:
            app:
              - path: /mosquitto/data
      passwd:
        type: secret
        name: mqtt-auth
        advancedMounts:
          mosquitto:
            app:
              - path: /mosquitto/secrets
                readOnly: true
    configMaps:
      config:
        data:
          mosquitto.conf: |
            persistence true
            persistence_location /mosquitto/data
            log_dest stdout
            allow_anonymous false
            password_file /mosquitto/secrets/passwd
            listener 1883
            listener 9001
            protocol websockets
