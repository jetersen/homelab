---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mosquitto
spec:
  parentRefs:
    - name: envoy-proxy
      namespace: kube-system
      sectionName: https
  hostnames:
    - mqtt.jetersen.dev
  rules:
    - matches:
        - path:
            type: Exact
            value: /socket
      backendRefs:
        - name: mosquitto
          port: 9001
