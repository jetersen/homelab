---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  labels:
    homelab.jetersen.dev/dns-profile: app-template
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      # External DNS goes directly to Technitium. Use the LAN URLs for app integrations.
      dnsPolicy: None
      dnsConfig:
        nameservers: [192.168.1.21, 192.168.1.2]
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      prowlarr:
        strategy: Recreate
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/prowlarr
              tag: 2.6.5.5623-ls162@sha256:f2b26429893d4c4cb71941b7ee50b1bdecd9d5f9f9e02d5410615e9f4f7c8d95
            env:
              TZ: Europe/Copenhagen
              PUID: "568"
              PGID: "568"
              UMASK: "002"
            securityContext:
              allowPrivilegeEscalation: false
            probes:
              liveness:
                enabled: true
                type: TCP
              readiness:
                enabled: true
                type: TCP
              startup:
                enabled: true
                type: TCP
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: prowlarr
        ports:
          http:
            port: 9696
    route:
      app:
        hostnames: [prowlarr.lan.jetersen.dev]
        parentRefs:
          - name: envoy-proxy
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 9696
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: local-path
        size: 5Gi
        retain: true
        globalMounts:
          - path: /config
