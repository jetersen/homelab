    homelab.jetersen.dev/flux-homelab-source: enabled
spec:
  targetNamespace: media
  path: ./kubernetes/apps/media/sonarr
  wait: true
  dependsOn:
    - name: media-storage
    - name: app-template
    - name: technitium
