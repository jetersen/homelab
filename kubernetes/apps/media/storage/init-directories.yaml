---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/job_v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: media-init-directories
  annotations:
    # Job pod templates are immutable. Re-running mkdir is safe on image updates.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -ec
            - |
              umask 002
              mkdir -p /data/torrents/incomplete /data/torrents/tv /data/torrents/movies /data/torrents/music
              mkdir -p /data/media/tv /data/media/movies /data/media/music
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: media-data
