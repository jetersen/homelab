---
apiVersion: batch/v1
kind: Job
metadata:
  name: media-init-directories
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -ec
            - |
              umask 002
              mkdir -p /data/torrents/incomplete /data/torrents/tv /data/torrents/movies /data/torrents/music
              mkdir -p /data/media/tv /data/media/movies /data/media/music
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: media-data
