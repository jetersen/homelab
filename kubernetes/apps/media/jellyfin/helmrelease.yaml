---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      # External DNS goes directly to Technitium. Use the LAN URLs for app integrations.
      dnsPolicy: None
      dnsConfig:
        nameservers: [192.168.1.21, 192.168.1.2]
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      jellyfin:
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/jellyfin/jellyfin
              tag: 12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037
            env:
              TZ: Europe/Copenhagen
              JELLYFIN_PublishedServerUrl: https://jellyfin.jetersen.dev
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              capabilities:
                drop: [ALL]
            probes:
              liveness:
                enabled: true
                type: TCP
              readiness:
                enabled: true
                type: TCP
              startup:
                enabled: true
                type: TCP
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
            resources:
              requests:
                cpu: 75m
                memory: 512Mi
                gpu.intel.com/i915: 1
              limits:
                memory: 4Gi
                gpu.intel.com/i915: 1
        initContainers:
          transcodes:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command:
              - sh
              - -ec
              - |
                mkdir -p /nas/.cache/jellyfin/transcodes
                test -w /nas/.cache/jellyfin/transcodes
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
    service:
      app:
        controller: jellyfin
        ports:
          http:
            port: 8096
    route:
      app:
        hostnames: [jellyfin.jetersen.dev]
        parentRefs:
          - name: envoy-proxy
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8096
    persistence:
      config:
        existingClaim: jellyfin-config-lvm
        type: persistentVolumeClaim
        advancedMounts:
          jellyfin:
            app:
              - path: /config
      data:
        type: persistentVolumeClaim
        existingClaim: media-data
        advancedMounts:
          jellyfin:
            app:
              - path: /data/media
                subPath: media
                readOnly: true
              # Keep Jellyfin's default transcode path, backed by dedicated NAS scratch space.
              - path: /cache/transcodes
                subPath: .cache/jellyfin/transcodes
            transcodes:
              - path: /nas
      cache:
        existingClaim: jellyfin-cache-lvm
        type: persistentVolumeClaim
        advancedMounts:
          jellyfin:
            app:
              - path: /cache
