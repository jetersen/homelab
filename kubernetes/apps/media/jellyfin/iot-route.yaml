---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-iot
spec:
  hostnames: [jellyfin-iot.jetersen.dev]
  parentRefs:
    - name: envoy-proxy
      namespace: kube-system
      sectionName: jellyfin-iot
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-iot-legacy-redirect
spec:
  hostnames:
  - jellyfin-iot.lan.jetersen.dev
  parentRefs:
  - name: envoy-proxy
    namespace: kube-system
    sectionName: jellyfin-iot-legacy
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        hostname: jellyfin-iot.jetersen.dev
        port: 443
        statusCode: 308
