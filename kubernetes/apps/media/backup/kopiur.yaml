apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: sonarr-backup
spec:
  backend:
    filesystem:
      path: /mnt/nas-repository
      volume:
        pvc:
          name: sonarr-nas-backup
  encryption:
    passwordSecretRef:
      name: sonarr-kopia-nas
      key: KOPIA_PASSWORD
  create:
    enabled: false
  mode: ReadWrite
  catalog:
    adoption: Ignore
    periodicRefresh: true
    refreshInterval: 1h
  scheduleDefaults:
    timezone: Etc/UTC
  concurrency:
    maxConcurrentJobs: 1
  moverDefaults:
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi
    cache:
      capacity: 1Gi
      metadataCacheSizeMb: 64
      contentCacheSizeMb: 128
    ttlSecondsAfterFinished: 3600
  maintenance:
    enabled: true
    takeoverPolicy: Force
    schedule:
      quick:
        cron: 10 */6 * * *
        jitter: 0s
      full:
        cron: 10 10 * * *
        jitter: 0s
      timezone: Etc/UTC
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: sonarr-offsite
spec:
  backend:
    s3:
      bucket: jetersen-homelab-kopia
      prefix: pilot/sonarr/
      endpoint: s3.de.io.cloud.ovh.net
      region: de
      auth:
        secretRef:
          name: sonarr-kopia
  encryption:
    passwordSecretRef:
      name: sonarr-kopia
      key: KOPIA_PASSWORD
  create:
    enabled: false
  mode: ReadOnly
  catalog:
    adoption: Ignore
    periodicRefresh: true
    refreshInterval: 1h
  scheduleDefaults:
    timezone: Etc/UTC
  concurrency:
    maxConcurrentJobs: 1
  moverDefaults:
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi
    cache:
      capacity: 1Gi
      metadataCacheSizeMb: 64
      contentCacheSizeMb: 128
    ttlSecondsAfterFinished: 3600
  maintenance:
    enabled: false
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: sonarr-backup
spec:
  repository:
    kind: Repository
    name: sonarr-backup
  identity:
    username: sonarr
    hostname: homelab
  sources:
  - pvc:
      name: sonarr-backup-exports
    sourcePathOverride: /data
  copyMethod: Direct
  defaultDeletionPolicy: Delete
  adoption: Ignore
  retention:
    keepLatest: 3
    keepHourly: 0
    keepDaily: 0
    keepWeekly: 0
    keepMonthly: 0
    keepAnnual: 0
  files:
    ignoreRules: []
    ignoreCacheDirs: false
  extraArgs:
  - --inherit=false
  - --clear-ignore
  - --clear-dot-ignore
  - --keep-latest=2147483647
  - --keep-hourly=0
  - --keep-daily=0
  - --keep-weekly=0
  - --keep-monthly=0
  - --keep-annual=0
  errorHandling:
    failFast: true
  hooks:
    beforeSnapshot:
    - runJob:
        timeout: 5m
        jobSpec:
          backoffLimit: 0
          activeDeadlineSeconds: 240
          template:
            spec:
              automountServiceAccountToken: false
              restartPolicy: Never
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                seccompProfile:
                  type: RuntimeDefault
              containers:
              - name: export
                image: forgejo.jetersen.dev/jetersen/homelab/backup-helper:main@sha256:30df8dc8a9f973a72fe3ea927a684cf557e6ab1c9883f33fef858ed63938234d
                args:
                - sonarr
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                    - ALL
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    memory: 512Mi
                volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: exports
                  mountPath: /exports
                - name: temporary
                  mountPath: /tmp
              volumes:
              - name: config
                persistentVolumeClaim:
                  claimName: sonarr
              - name: exports
                persistentVolumeClaim:
                  claimName: sonarr-backup-exports
              - name: temporary
                emptyDir:
                  medium: Memory
                  sizeLimit: 256Mi
              imagePullSecrets:
              - name: homelab-oci-auth
          ttlSecondsAfterFinished: 3600
  verification:
    verifyFilesPercent: 100
    quick:
      schedule:
        cron: 0 9 * * *
        jitter: 0s
    successExpr: stats.files > 0 && stats.errors == 0
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: sonarr-backup
spec:
  policyRef:
    name: sonarr-backup
  schedule:
    cron: 10 7 * * *
    timezone: Etc/UTC
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 2
  deletion:
    onScheduleDelete: Retain
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: RepositoryReplication
metadata:
  name: sonarr-offsite
spec:
  sourceRef:
    kind: Repository
    name: sonarr-backup
  destination:
    s3:
      bucket: jetersen-homelab-kopia
      prefix: pilot/sonarr/
      endpoint: s3.de.io.cloud.ovh.net
      region: de
      auth:
        secretRef:
          name: sonarr-kopia
  schedule:
    cron: 45 * * * *
    timezone: Etc/UTC
    jitter: 0s
  sync:
    parallel: 4
    deleteExtra: true
    mustExist: true
    update: true
