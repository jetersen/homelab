---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: photoprism-originals
spec:
  deletion:
    onScheduleDelete: Retain
  failedJobsHistoryLimit: 2
  policyRef:
    name: photoprism-originals
  schedule:
    concurrencyPolicy: Forbid
    cron: 30 2 * * *
    startingDeadlineSeconds: 3600
    timezone: Etc/UTC
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: RepositoryReplication
metadata:
  name: photoprism-offsite
spec:
  destination:
    s3:
      auth:
        secretRef:
          name: photoprism-kopia
      bucket: jetersen-homelab-kopia
      endpoint: s3.de.io.cloud.ovh.net
      prefix: applications/photoprism/
      region: de
  schedule:
    cron: 20 * * * *
    jitter: 0s
    timezone: Etc/UTC
  sourceRef:
    kind: Repository
    name: photoprism-backup
  sync:
    deleteExtra: true
    mustExist: true
    parallel: 4
    update: true
