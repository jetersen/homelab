apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: photoprism
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      photoprism:
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/photoprism/photoprism
              tag: 261029-ce@sha256:2a0856a677dfabf67e8b78d2450549a436d08cdf970e0193cbf457b7572de89e
            command:
            - /opt/photoprism/bin/photoprism
            args:
            - start
            env:
              TZ: Europe/Copenhagen
              PHOTOPRISM_ADMIN_USER: joseph
              PHOTOPRISM_SITE_URL: https://photos.jetersen.dev/
              PHOTOPRISM_AUTH_MODE: password
              PHOTOPRISM_DATABASE_DRIVER: sqlite
              PHOTOPRISM_DISABLE_TLS: 'true'
              PHOTOPRISM_DEFAULT_TLS: 'false'
              PHOTOPRISM_READONLY: 'true'
              PHOTOPRISM_DISABLE_CHOWN: 'true'
              PHOTOPRISM_DISABLE_WEBDAV: 'true'
              PHOTOPRISM_DISABLE_MCP: 'true'
              PHOTOPRISM_WORKERS: '1'
              PHOTOPRISM_INDEX_SCHEDULE: '*/15 * * * *'
              PHOTOPRISM_BACKUP_DATABASE: 'false'
              PHOTOPRISM_BACKUP_RETAIN: '3'
            envFrom:
            - secretRef:
                name: photoprism-admin
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: 2342
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 90
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: 2342
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: 2342
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 4Gi
    service:
      app:
        controller: photoprism
        ports:
          http:
            port: 2342
    route:
      app:
        hostnames:
        - photos.jetersen.dev
        parentRefs:
        - name: envoy-proxy
          namespace: kube-system
          sectionName: https
        rules:
        - backendRefs:
          - identifier: app
            port: 2342
          timeouts:
            request: 0s
            backendRequest: 0s
    persistence:
      home:
        type: emptyDir
        globalMounts:
        - path: /home/user-568
      storage:
        existingClaim: photoprism-lvm
        type: persistentVolumeClaim
        globalMounts:
        - path: /photoprism/storage
      originals:
        type: persistentVolumeClaim
        existingClaim: photoprism-originals
        globalMounts:
        - path: /photoprism/originals
          readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
