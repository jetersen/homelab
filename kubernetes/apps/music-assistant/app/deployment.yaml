apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: music-assistant
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: homelab-oci-auth
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: talos01
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: forgejo.jetersen.dev/jetersen/music-assistant:2.10.6-private.2@sha256:ae21d4d7cd2c6093a91bafa9b78d4a6637f21c0c55f50ef7e99d501b3da95948
        env:
        - name: MA_TRACK_CACHE_DIR
          value: /track-cache
        - name: MA_TRACK_CACHE_MAX_BYTES
          value: "19327352832"
        - name: MA_TRACK_CACHE_MEMORY_BYTES
          value: "134217728"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
        ports:
        - name: http
          containerPort: 8095
        - name: stream
          containerPort: 8097
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: http
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 20
        volumeMounts:
        - name: data
          mountPath: /data
        - name: track-cache
          mountPath: /track-cache
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: music-assistant
      - name: track-cache
        persistentVolumeClaim:
          claimName: music-assistant-track-cache
