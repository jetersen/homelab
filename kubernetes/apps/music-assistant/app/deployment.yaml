apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: music-assistant
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: talos01
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: forgejo.jetersen.dev/jetersen/homelab/music-assistant:2.10.6-videos.1@sha256:2466729f9b3cd7757be8f6a39109922bf1abe764dd63d7ac4b73307056ace7ee
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
        ports:
        - name: http
          containerPort: 8095
        - name: stream
          containerPort: 8097
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: http
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 20
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: music-assistant
