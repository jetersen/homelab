apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: music-assistant
  template:
    metadata:
      labels: *id001
      annotations:
        k8s.v1.cni.cncf.io/networks: music-assistant-lan@lan0
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: homelab-oci-auth
      hostname: music-assistant
      nodeSelector:
        kubernetes.io/hostname: talos01
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - image: docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        command:
          - /bin/sh
          - -ec
        args:
          - |
            # macvlan cannot reach its parent host; keep kubelet replies on Cilium.
            gateway=$(ip -4 route show default dev eth0 | awk '$1 == "default" && $2 == "via" { print $3; exit }')
            test -n "${gateway}"
            ip -4 route replace "${NODE_IP}/32" via "${gateway}" dev eth0
        env:
          - name: NODE_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
            add:
              - NET_ADMIN
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 32Mi
        name: node-route
      containers:
      - name: app
        image: forgejo.jetersen.dev/jetersen/music-assistant:2.10.6-private.4@sha256:863cd512d38e3641b693a567103c2f8a244fb99c5cf6694fb1b3a199197c7756
        env:
        - name: HOME
          value: /data
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: MA_TRACK_CACHE_DIR
          value: /track-cache
        - name: MA_TRACK_CACHE_MAX_BYTES
          value: "19327352832"
        - name: MA_TRACK_CACHE_MEMORY_BYTES
          value: "134217728"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
        ports:
        - name: http
          containerPort: 8095
        - name: stream
          containerPort: 8097
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: http
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 20
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
        - name: track-cache
          mountPath: /track-cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: music-assistant
      - name: track-cache
        persistentVolumeClaim:
          claimName: music-assistant-track-cache
