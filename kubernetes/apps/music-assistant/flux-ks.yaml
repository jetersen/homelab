apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: music-assistant
  namespace: flux-system
  labels:
    homelab.jetersen.dev/flux-defaults: enabled
    homelab.jetersen.dev/flux-homelab-source: enabled
    homelab.jetersen.dev/flux-wait: enabled
spec:
  targetNamespace: home-assistant
  dependsOn:
    - name: openebs-lvm
    - name: multus
  path: ./kubernetes/apps/music-assistant/app
