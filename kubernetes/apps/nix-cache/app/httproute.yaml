apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nix-cache
spec:
  parentRefs:
    - name: envoy-proxy
      namespace: kube-system
      sectionName: https
  hostnames:
    - nix-cache.jetersen.dev
  rules:
    - backendRefs:
        - name: nix-cache
          port: 8080
      timeouts:
        request: 600s
        backendRequest: 600s
