apiVersion: apps/v1
kind: Deployment
metadata:
  name: nix-cache
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nix-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nix-cache
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: attic
          image: ghcr.io/zhaofengli/attic:latest@sha256:18574aba70fc89d2b695273fbe2e7b2f8ad7e8e786b4cc535124fbe14bada1d0
          args: [-f, /config/server.toml]
          envFrom:
            - secretRef:
                name: nix-cache-credentials
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            tcpSocket: &healthcheck
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket: *healthcheck
          livenessProbe:
            tcpSocket: *healthcheck
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /var/lib/atticd
      volumes:
        - name: config
          configMap:
            name: nix-cache-config
        - name: data
          persistentVolumeClaim:
            claimName: nix-cache-data
