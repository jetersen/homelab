listen = "0.0.0.0:8080"
allowed-hosts = ["nix-cache.jetersen.dev"]
api-endpoint = "https://nix-cache.jetersen.dev/"

[database]
url = "sqlite:///var/lib/atticd/server.db?mode=rwc"

[storage]
type = "local"
path = "/var/lib/atticd/storage"

[chunking]
nar-size-threshold = 65536
min-size = 16384
avg-size = 65536
max-size = 262144

[compression]
type = "zstd"
level = 3

[garbage-collection]
interval = "12 hours"
default-retention-period = "60 days"
