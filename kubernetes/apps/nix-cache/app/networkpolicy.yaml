apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nix-cache
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nix-cache
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: envoy-proxy
      ports:
        - port: 8080
          protocol: TCP
  egress: []
