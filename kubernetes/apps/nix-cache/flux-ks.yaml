apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nix-cache
  namespace: flux-system
  labels:
    homelab.jetersen.dev/flux-defaults: enabled
    homelab.jetersen.dev/flux-homelab-source: enabled
    homelab.jetersen.dev/flux-wait: enabled
spec:
  dependsOn:
    - name: openebs-lvm
    - name: envoy-gateway-config
  targetNamespace: nix-cache
  path: ./kubernetes/apps/nix-cache/app
