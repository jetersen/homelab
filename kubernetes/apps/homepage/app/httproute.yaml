---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  annotations:
    public.external-dns.alpha.kubernetes.io/enabled: "false"
spec:
  parentRefs:
    - name: envoy-proxy
      namespace: kube-system
      sectionName: https
  hostnames:
    - home.jetersen.dev
  rules:
    - backendRefs:
        - name: homepage
          port: 3000
