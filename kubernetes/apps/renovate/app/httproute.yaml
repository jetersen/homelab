apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: renovate-webhook
spec:
  parentRefs:
    - name: envoy-proxy
      namespace: kube-system
      sectionName: https
  hostnames: [renovate-webhook.jetersen.dev]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook/v1/
      backendRefs:
        - name: renovate-operator
          port: 8082
