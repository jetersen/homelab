apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: forgejo
spec:
  # Discovery also queues dependency scans. Events maintain PRs between scans.
  schedule: '17 */6 * * *'
  suspend: false
  image: forgejo.jetersen.dev/jetersen/homelab/renovate-worker:0.1.4@sha256:ed2a59373458708786c96a2665d51e5e17faecd288489c68679394d573516895
  provider:
    name: forgejo
    endpoint: https://forgejo.jetersen.dev/api/v1
  discoveryFilters:
    - jetersen/homelab
    - jetersen/dotfiles
    - jetersen/music-assistant
    - jetersen/pc2mqtt
  skipForks: false
  secretRef: renovate-credentials
  parallelism: 1
  securityContext:
    pod:
      runAsGroup: 0
    container:
      runAsGroup: 0
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      memory: 4Gi
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-credentials
        key: WEBHOOK_TOKEN
    sync:
      enabled: true
      secretRef:
        name: renovate-webhook-sync
        key: token
  extraVolumes:
    - name: cache
      persistentVolumeClaim:
        claimName: renovate-cache
  extraVolumeMounts:
    - name: cache
      mountPath: /cache
