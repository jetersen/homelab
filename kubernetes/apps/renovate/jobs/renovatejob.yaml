apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: forgejo
spec:
  # Discovery also queues dependency scans. Events maintain PRs between scans.
  schedule: '17 */6 * * *'
  suspend: false
  image: forgejo.jetersen.dev/jetersen/homelab/renovate-worker:0.1.1
  provider:
    name: forgejo
    endpoint: https://forgejo.jetersen.dev/api/v1
  discoveryFilters:
    - jetersen/homelab
    - jetersen/dotfiles
    - jetersen/music-assistant
    - jetersen/pc2mqtt
  skipForks: false
  secretRef: renovate-credentials
  extraEnv:
    - name: RENOVATE_DRY_RUN
      value: full
  parallelism: 1
  securityContext:
    pod:
      runAsGroup: 0
    container:
      runAsGroup: 0
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 4Gi
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-credentials
        key: WEBHOOK_TOKEN
    sync:
      enabled: true
      secretRef:
        name: renovate-webhook-sync
        key: token
  extraVolumes:
    - name: cache
      persistentVolumeClaim:
        claimName: renovate-cache
  extraVolumeMounts:
    - name: cache
      mountPath: /cache
