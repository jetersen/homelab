# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo
resources:
  - source.yaml
  - helmrelease.yaml
  - storage.yaml
  - nas-storage.sops.yaml
  - admin-secret.sops.yaml
  - github-oauth.sops.yaml
  - access-policy.yaml
  - error-page.yaml
configMapGenerator:
  - name: forgejo-error-page
    files:
      - response.body=error-page.html
    options:
      disableNameSuffixHash: true
components:
  - ../../../components/oci-source-defaults
  - ../../../components/helmrelease-defaults
