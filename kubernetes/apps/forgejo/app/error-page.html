  <title>Taking a short break · Forgejo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #181f28; color: #f4f1eb; font-family: system-ui, sans-serif; display: grid; grid-template-rows: 1fr auto; }
    main { width: min(1120px, 92vw); margin: auto; display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 64px 0; gap: 16px; }
    .mascot { display: block; width: min(560px, 46vw); height: auto; }
    .copy { max-width: 470px; }
    .brand { color: #f6a658; font-size: 18px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; margin: 0 0 32px; }
    h1 { font-size: clamp(36px, 4.5vw, 58px); font-weight: 650; line-height: 1.08; letter-spacing: -.04em; margin: 0 0 24px; }
    .detail { color: #b7c1cc; font-size: 18px; line-height: 1.7; margin: 0 0 32px; }
    .retry { display: inline-flex; align-items: center; gap: 14px; padding: 14px 24px; border-radius: 8px; background: #f6a658; color: #1b2028; text-decoration: none; font-weight: 650; }
    .retry:hover { background: #ffbe7f; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    .note { color: #95a2b1; font-size: 14px; margin: 20px 0 0; }
    footer { color: #95a2b1; font-size: 12px; padding: 20px 24px; text-align: center; line-height: 1.6; }
    footer a { color: inherit; text-underline-offset: 3px; }
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; gap: 0; padding: 24px 0 40px; }
      .mascot { width: min(420px, 86vw); margin: auto; }
      .copy { padding: 0 16px; margin: auto; text-align: center; }
      .brand { margin-bottom: 20px; }
      .detail { font-size: 16px; }
    }
  </style>
