# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/serviceaccount_v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-ci
automountServiceAccountToken: false
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: forgejo-ci
spec:
  secretTargetRef:
    - parameter: token
      name: forgejo-ci-credentials
      key: scaler-token
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: forgejo-ci
spec:
  pollingInterval: 10
  minReplicaCount: 0
  maxReplicaCount: 2
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  rollout:
    strategy: gradual
  jobTargetRef:
    backoffLimit: 0
    activeDeadlineSeconds: 3600
    ttlSecondsAfterFinished: 300
    template:
      metadata:
        labels:
          app.kubernetes.io/name: forgejo-ci
      spec:
        restartPolicy: Never
        serviceAccountName: forgejo-ci
        automountServiceAccountToken: false
        terminationGracePeriodSeconds: 75
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          - name: runner-binary
            image: data.forgejo.org/forgejo/runner:13@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552
            command: [/bin/sh, -ec]
            args: [cp /bin/forgejo-runner /runner/forgejo-runner]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            volumeMounts:
              - name: binary
                mountPath: /runner
          # Restartable init sidecar stops automatically when the one-job runner exits.
          - name: docker
            image: docker.io/library/docker:29.8.2-dind@sha256:1e08cdb63405ca788aea94ef35b792d1e299607c667d33d7bcbcae1fd2611ced
            restartPolicy: Always
            command: [/bin/sh, -ec]
            args:
              - |
                parent=$(awk -F: '$1 == "0" {print $3}' /proc/self/cgroup)
                test -n "$parent" && test "$parent" != /
                exec dockerd-entrypoint.sh --tls=false --storage-driver=overlay2 --dns=172.23.0.10 --cgroup-parent="$parent"
            env:
              - name: DOCKER_TLS_CERTDIR
                value: ''
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              privileged: true
            startupProbe:
              exec:
                command: [docker, --host=tcp://127.0.0.1:2375, info]
              periodSeconds: 2
              failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 6Gi
            volumeMounts:
              - name: docker-data
                mountPath: /var/lib/docker
        containers:
          - name: runner
            image: forgejo.jetersen.dev/jetersen/homelab/runner-job:0.3.0@sha256:fe6cbc1e84f52d08c41b68d21d5eabcfeed9292c282ff19955a9b4aa7dd05a14
            command: [/bin/bash, -ec]
            # Exit status 2 means Rocket claimed the queued task first; finish without a failed Job.
            args:
              - |
                /runner/forgejo-runner --config /config/runner.yaml one-job --url https://forgejo.jetersen.dev --uuid "$(cat /registration/uuid)" --token-url file:/registration/token &
                runner=$!
                trap 'kill -TERM "$runner" 2>/dev/null' TERM INT
                status=0
                wait "$runner" || status=$?
                while kill -0 "$runner" 2>/dev/null; do
                  status=0
                  wait "$runner" || status=$?
                done
                if [ "$status" -eq 2 ]; then
                  echo 'No queued task remained for this worker'
                  exit 0
                fi
                exit "$status"
            workingDir: /data
            env:
              - name: HOME
                value: /data
              - name: DOCKER_CONFIG
                value: /data/docker
              - name: XDG_CACHE_HOME
                value: /data/cache
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 200m
                memory: 128Mi
              limits:
                memory: 512Mi
            volumeMounts:
              - name: binary
                mountPath: /runner
                readOnly: true
              - name: config
                mountPath: /config
                readOnly: true
              - name: registration
                mountPath: /registration
                readOnly: true
              - name: data
                mountPath: /data
              - name: tmp
                mountPath: /tmp
        volumes:
          - name: binary
            emptyDir: {}
          - name: data
            emptyDir: {}
          - name: tmp
            emptyDir: {}
          - name: config
            configMap:
              name: forgejo-ci-config
          - name: registration
            secret:
              secretName: forgejo-ci-credentials
              defaultMode: 0440
              items:
                - key: runner-uuid
                  path: uuid
                - key: runner-token
                  path: token
          - name: docker-data
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes: [ReadWriteOnce]
                  storageClassName: openebs-lvm-ephemeral
                  resources:
                    requests:
                      storage: 20Gi
  triggers:
    - type: forgejo-runner
      metadata:
        address: https://forgejo.jetersen.dev
        owner: jetersen
        repo: homelab
        labels: linux-docker
      authenticationRef:
        name: forgejo-ci
