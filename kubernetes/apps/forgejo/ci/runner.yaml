log:
  level: info
runner:
  capacity: 1
  timeout: 45m
  shutdown_timeout: 1m
  labels:
    - linux-docker:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.8.1@sha256:77819d134fc807fe2eab96fee9abf3c6be417d89cac4d3f3cfec50582874ce61
    - runner-kubernetes:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.8.1@sha256:77819d134fc807fe2eab96fee9abf3c6be417d89cac4d3f3cfec50582874ce61
  envs:
    DOCKER_HOST: tcp://docker:2375
cache:
  enabled: false
container:
  docker_host: tcp://forgejo-ci-docker:2375
  options: --add-host=docker:host-gateway --dns-option=ndots:1 --dns-search=.
  privileged: false
  valid_volumes: []
  force_pull: true
# Docker execution still stages action sources in the runner's writable directory.
host:
  workdir_parent: /data/workspace
