log:
  level: info
runner:
  capacity: 1
  timeout: 45m
  shutdown_timeout: 1m
  labels:
    - linux-docker:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:0.3.1@sha256:3511a6c0d5e8af93b0f4801371f8cf06bb90ebda376a2d27654ea5386cbb3523
    - runner-kubernetes:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:0.3.1@sha256:3511a6c0d5e8af93b0f4801371f8cf06bb90ebda376a2d27654ea5386cbb3523
  envs:
    DOCKER_HOST: tcp://docker:2375
cache:
  enabled: false
container:
  docker_host: tcp://127.0.0.1:2375
  options: --add-host=docker:host-gateway --dns-option=ndots:1 --dns-search=.
  privileged: false
  valid_volumes: []
  force_pull: true
# Docker execution still stages action sources in the runner's writable directory.
host:
  workdir_parent: /data/workspace
