log:
  level: info
runner:
  capacity: 1
  timeout: 45m
  shutdown_timeout: 1m
  labels:
    - linux-docker:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.6.0@sha256:982aa86491ece674f10acb6a1227f9d825cd5ab1700415e3df58678dc8768abd
    - runner-kubernetes:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.6.0@sha256:982aa86491ece674f10acb6a1227f9d825cd5ab1700415e3df58678dc8768abd
  envs:
    DOCKER_HOST: tcp://docker:2375
cache:
  enabled: false
container:
  docker_host: tcp://127.0.0.1:2375
  options: --add-host=docker:host-gateway --dns-option=ndots:1 --dns-search=.
  privileged: false
  valid_volumes: []
  force_pull: true
# Docker execution still stages action sources in the runner's writable directory.
host:
  workdir_parent: /data/workspace
