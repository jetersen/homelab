log:
  level: info
runner:
  capacity: 1
  timeout: 45m
  shutdown_timeout: 1m
  labels:
    - linux-docker:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.4.1@sha256:d0e384fcf0c301a758c568e0092bcdb20ace6fe0d4ea9749e6ddd72f2eeed95a39
    - runner-kubernetes:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.4.1@sha256:d0e384fcf0c301a758c568e0092bcdb20ace6fe0d4ea9749e6ddd72f2eeed95a39
  envs:
    DOCKER_HOST: tcp://docker:2375
cache:
  enabled: false
container:
  docker_host: tcp://127.0.0.1:2375
  options: --add-host=docker:host-gateway --dns-option=ndots:1 --dns-search=.
  privileged: false
  valid_volumes: []
  force_pull: true
# Docker execution still stages action sources in the runner's writable directory.
host:
  workdir_parent: /data/workspace
