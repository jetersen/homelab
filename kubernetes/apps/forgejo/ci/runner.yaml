log:
  level: info
runner:
  capacity: 1
  timeout: 45m
  shutdown_timeout: 1m
  labels:
    - linux-docker:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.5.2@sha256:aefcd98fc4e2b636a715d205cf1a8736bdc44634584d7c5ab1c40a7408ec1388
    - runner-kubernetes:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.5.2@sha256:aefcd98fc4e2b636a715d205cf1a8736bdc44634584d7c5ab1c40a7408ec1388
  envs:
    DOCKER_HOST: tcp://docker:2375
cache:
  enabled: false
container:
  docker_host: tcp://127.0.0.1:2375
  options: --add-host=docker:host-gateway --dns-option=ndots:1 --dns-search=.
  privileged: false
  valid_volumes: []
  force_pull: true
# Docker execution still stages action sources in the runner's writable directory.
host:
  workdir_parent: /data/workspace
