log:
  level: info
runner:
  capacity: 1
  timeout: 45m
  shutdown_timeout: 1m
  labels:
    - linux-docker:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.8.5@sha256:fa62e6623af06eb1de862ffe12114bf45e671c17c767e2a9b7f708ff5a9a7656
    - runner-kubernetes:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.8.5@sha256:fa62e6623af06eb1de862ffe12114bf45e671c17c767e2a9b7f708ff5a9a7656
  envs:
    DOCKER_HOST: tcp://docker:2375
cache:
  enabled: false
container:
  docker_host: tcp://forgejo-ci-docker:2375
  options: --add-host=docker:host-gateway --dns-option=ndots:1 --dns-search=.
  privileged: false
  valid_volumes: []
  force_pull: true
# Docker execution still stages action sources in the runner's writable directory.
host:
  workdir_parent: /data/workspace
