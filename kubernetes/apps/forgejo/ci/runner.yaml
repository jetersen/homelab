log:
  level: info
runner:
  capacity: 1
  timeout: 45m
  shutdown_timeout: 1m
  labels:
    - linux-docker:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.4.0@sha256:b37fa670d98a1dcaa6d7593da076658210ce5fad9f1a6eb97e2dbf105835aa41
    - runner-kubernetes:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.4.0@sha256:b37fa670d98a1dcaa6d7593da076658210ce5fad9f1a6eb97e2dbf105835aa41
  envs:
    DOCKER_HOST: tcp://docker:2375
cache:
  enabled: false
container:
  docker_host: tcp://127.0.0.1:2375
  options: --add-host=docker:host-gateway --dns-option=ndots:1 --dns-search=.
  privileged: false
  valid_volumes: []
  force_pull: true
# Docker execution still stages action sources in the runner's writable directory.
host:
  workdir_parent: /data/workspace
