# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - scaledjob.yaml
  - dotfiles-scaledjob.yaml
  - dotfiles-credentials.sops.yaml
  - docker-backend.yaml
  - networkpolicy.yaml
  - credentials.sops.yaml
configMapGenerator:
  - name: forgejo-ci-config
    files:
      - runner.yaml
      - dotfiles-runner.yaml
      - docker-entrypoint.sh
      - docker.json
generatorOptions:
  disableNameSuffixHash: true
