apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: forgejo-ci-dotfiles
spec:
  secretTargetRef:
    - parameter: token
      name: forgejo-ci-dotfiles-credentials
      key: scaler-token
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: forgejo-ci-dotfiles
spec:
  pollingInterval: 10
  minReplicaCount: 0
  maxReplicaCount: 1
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  rollout:
    strategy: gradual
  jobTargetRef:
    backoffLimit: 0
    activeDeadlineSeconds: 7200
    ttlSecondsAfterFinished: 300
    template:
      metadata:
        labels:
          app.kubernetes.io/name: forgejo-ci
      spec:
        restartPolicy: Never
        serviceAccountName: forgejo-ci
        automountServiceAccountToken: false
        terminationGracePeriodSeconds: 75
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          - name: runner-binary
            image: data.forgejo.org/forgejo/runner:13@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552
            command: [/bin/sh, -ec]
            args: [cp /bin/forgejo-runner /runner/forgejo-runner]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            volumeMounts:
              - name: binary
                mountPath: /runner
        containers:
          - name: runner
            image: forgejo.jetersen.dev/jetersen/homelab/runner-job:1.8.2@sha256:fd2786fdef2ac0f76ae995f56451d341d2b7754008b9cca4157aa8b3d7611044
            command: [/bin/bash, -ec]
            # Exit status 2 means the queued task disappeared before this worker claimed it.
            args:
              - |
                until docker --host=tcp://forgejo-ci-docker:2375 info > /dev/null 2>&1; do sleep 2; done
                /runner/forgejo-runner --config /config/dotfiles-runner.yaml one-job --url https://forgejo.jetersen.dev --uuid "$(cat /registration/uuid)" --token-url file:/registration/token &
                runner=$!
                trap 'kill -TERM "$runner" 2>/dev/null' TERM INT
                status=0
                wait "$runner" || status=$?
                while kill -0 "$runner" 2>/dev/null; do
                  status=0
                  wait "$runner" || status=$?
                done
                if [ "$status" -eq 2 ]; then
                  echo 'No queued task remained for this worker'
                  exit 0
                fi
                exit "$status"
            workingDir: /data
            env:
              - name: HOME
                value: /data
              - name: DOCKER_CONFIG
                value: /data/docker
              - name: XDG_CACHE_HOME
                value: /data/cache
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 200m
                memory: 128Mi
              limits:
                memory: 512Mi
            volumeMounts:
              - name: binary
                mountPath: /runner
                readOnly: true
              - name: config
                mountPath: /config
                readOnly: true
              - name: registration
                mountPath: /registration
                readOnly: true
              - name: data
                mountPath: /data
              - name: tmp
                mountPath: /tmp
        volumes:
          - name: binary
            emptyDir: {}
          - name: data
            emptyDir: {}
          - name: tmp
            emptyDir: {}
          - name: config
            configMap:
              name: forgejo-ci-config
          - name: registration
            secret:
              secretName: forgejo-ci-dotfiles-credentials
              defaultMode: 0440
              items:
                - key: runner-uuid
                  path: uuid
                - key: runner-token
                  path: token
  triggers:
    - type: forgejo-runner
      metadata:
        address: https://forgejo.jetersen.dev
        owner: jetersen
        repo: dotfiles
        labels: linux-docker,runner-kubernetes
      authenticationRef:
        name: forgejo-ci-dotfiles
