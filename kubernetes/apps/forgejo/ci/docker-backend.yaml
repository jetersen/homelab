apiVersion: v1
kind: Service
metadata:
  name: forgejo-ci-docker
spec:
  selector:
    app.kubernetes.io/name: forgejo-ci-docker
  ports:
    - name: docker
      port: 2375
      targetPort: 2375
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo-ci-docker
spec:
  serviceName: forgejo-ci-docker
  replicas: 1
  updateStrategy:
    type: OnDelete
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-ci-docker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-ci-docker
    spec:
      serviceAccountName: forgejo-ci
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docker
          image: docker.io/library/docker:29.9.1-dind@sha256:3e5756e2b6dad6a5f1f5deacf0a19f9eaa2581b76ae092b2d4a118162e1d4d4e
          command:
            - /bin/sh
            - /config/docker-entrypoint.sh
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            privileged: true
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test -e /tmp/cache-ready && docker --host=tcp://127.0.0.1:2375 info
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 12Gi
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            exec:
              command:
                - docker
                - --host=tcp://127.0.0.1:2375
                - info
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: forgejo-ci-config
  volumeClaimTemplates:
    - metadata:
        name: docker-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: openebs-lvm-thin
        resources:
          requests:
            storage: 20Gi
