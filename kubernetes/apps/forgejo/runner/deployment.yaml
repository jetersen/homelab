# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/serviceaccount_v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-runner
automountServiceAccountToken: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      annotations:
        homelab.jetersen.dev/runner-scope: user
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      serviceAccountName: forgejo-runner
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 600
      hostAliases:
        - ip: 127.0.0.1
          hostnames: [docker]
      securityContext:
        fsGroup: 1000
      # Start Docker and pass its startup probe before the runner contacts it.
      initContainers:
        - name: docker
          restartPolicy: Always
          image: docker.io/library/docker:29.8.2-dind@sha256:1e08cdb63405ca788aea94ef35b792d1e299607c667d33d7bcbcae1fd2611ced
          args: [--tls=false, --storage-driver=overlay2]
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ''
          securityContext:
            privileged: true
          startupProbe:
            exec:
              command: [docker, info]
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [docker, info]
            timeoutSeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 3Gi
          volumeMounts:
            - name: docker-cache
              mountPath: /var/lib/docker
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552
          command: [/bin/sh, -ec]
          args:
            - exec forgejo-runner --config /config/runner.yaml daemon --url https://forgejo.jetersen.dev --uuid "$(cat /registration/uuid)" --token-url file:/registration/token
          workingDir: /data
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: registration
              mountPath: /registration
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: forgejo-runner-config
        - name: registration
          secret:
            secretName: forgejo-runner-registration
            defaultMode: 0440
        - name: data
          emptyDir: {}
        - name: docker-cache
          persistentVolumeClaim:
            claimName: forgejo-runner-docker-cache-lvm
