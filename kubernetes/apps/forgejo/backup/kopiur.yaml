# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/repository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: forgejo-backup
spec:
  backend:
    s3:
      bucket: jetersen-homelab-kopia
      prefix: applications/forgejo/
      endpoint: s3.de.io.cloud.ovh.net
      region: de
      auth:
        secretRef:
          name: forgejo-kopia
  encryption:
    passwordSecretRef:
      name: forgejo-kopia
      key: KOPIA_PASSWORD
  create:
    enabled: false
  mode: ReadWrite
  catalog:
    adoption: Ignore
    periodicRefresh: true
    refreshInterval: 1h
  scheduleDefaults:
    timezone: Etc/UTC
  concurrency:
    maxConcurrentJobs: 1
  moverDefaults:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi
    cache:
      storageClassName: openebs-lvm-ephemeral
      # Kopia cache budgets are soft limits; verification needs burst headroom.
      capacity: 4Gi
      metadataCacheSizeMb: 64
      contentCacheSizeMb: 128
    ttlSecondsAfterFinished: 1200
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
  maintenance:
    enabled: true
    mover:
      cache:
        mode: Persistent
    takeoverPolicy: Force
    schedule:
      quick:
        cron: 0 4 * * *
        jitter: 0s
      full:
        cron: 0 4 * * 0
        jitter: 0s
      timezone: Etc/UTC
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: forgejo-backup
spec:
  repository:
    kind: Repository
    name: forgejo-backup
  identity:
    username: forgejo
    hostname: homelab
  sources:
  - pvc:
      name: forgejo-backup-staging
    sourcePathOverride: /stage
  copyMethod: Direct
  defaultDeletionPolicy: Delete
  adoption: Ignore
  retention:
    keepLatest: 0
    keepHourly: 0
    keepDaily: 14
    keepWeekly: 4
    keepMonthly: 0
    keepAnnual: 0
  files:
    ignoreRules:
    - /.forgejo-staging
    ignoreCacheDirs: false
  extraArgs:
  - --inherit=false
  - --clear-dot-ignore
  - --keep-latest=2147483647
  - --keep-hourly=0
  - --keep-daily=0
  - --keep-weekly=0
  - --keep-monthly=0
  - --keep-annual=0
  errorHandling:
    failFast: true
  hooks:
    beforeSnapshot:
    - runJob:
        timeout: 25m
        jobSpec:
          backoffLimit: 0
          activeDeadlineSeconds: 1500
          template:
            spec:
              serviceAccountName: forgejo-backup
              automountServiceAccountToken: true
              restartPolicy: Never
              terminationGracePeriodSeconds: 360
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
                fsGroup: 1000
                fsGroupChangePolicy: OnRootMismatch
                seccompProfile:
                  type: RuntimeDefault
              containers:
              - name: backup
                image: forgejo.jetersen.dev/jetersen/homelab/backup-helper:0.1.1@sha256:388556fbea7c2217c7640e247d9e8a0e56193a7e29b2e29d05dde098e48de5a1
                args:
                - forgejo
                securityContext:
                  runAsNonRoot: true
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                    - ALL
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    memory: 1Gi
                volumeMounts:
                - name: cache
                  mountPath: /cache
                - name: temp
                  mountPath: /tmp
                - name: local
                  mountPath: /source/local
                  readOnly: true
                - name: nas
                  mountPath: /source/nas
                  readOnly: true
                - name: staging
                  mountPath: /stage
                  readOnly: false
              volumes:
              - name: cache
                emptyDir:
                  sizeLimit: 6Gi
              - name: temp
                emptyDir:
                  sizeLimit: 6Gi
              - name: local
                persistentVolumeClaim:
                  claimName: forgejo-local-lvm
              - name: nas
                persistentVolumeClaim:
                  claimName: forgejo-nas
                  readOnly: true
              - name: staging
                persistentVolumeClaim:
                  claimName: forgejo-backup-staging
                  readOnly: false
          ttlSecondsAfterFinished: 1200
  verification:
    verifyFilesPercent: 100
    quick:
      schedule:
        cron: 0 9 * * *
        jitter: 0s
    successExpr: stats.files > 0 && stats.errors == 0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: forgejo-backup
spec:
  policyRef:
    name: forgejo-backup
  schedule:
    cron: 0 3 * * *
    timezone: Etc/UTC
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 2
  deletion:
    onScheduleDelete: Retain
