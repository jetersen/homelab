# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/serviceaccount_v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-backup
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/role_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-backup
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - forgejo
  verbs:
  - get
  - patch
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - list
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/rolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgejo-backup
subjects:
- kind: ServiceAccount
  name: forgejo-backup
  namespace: forgejo
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-backup-recovery
spec:
  # Resume Forgejo if a backup pod dies while it is paused. Kopiur skips
  # afterSnapshot hooks when the pausing beforeSnapshot hook fails.
  schedule: '*/15 * * * *'
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  # Retain failures beyond the 15-minute alert delay.
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 1200
      backoffLimit: 0
      activeDeadlineSeconds: 420
      template:
        spec:
          serviceAccountName: forgejo-backup
          automountServiceAccountToken: true
          restartPolicy: Never
          terminationGracePeriodSeconds: 360
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: backup
            image: forgejo.jetersen.dev/jetersen/homelab/backup-helper:0.1.1@sha256:388556fbea7c2217c7640e247d9e8a0e56193a7e29b2e29d05dde098e48de5a1
            args:
            - forgejo-recover
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
