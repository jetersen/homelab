apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-backup
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - forgejo
  verbs:
  - get
  - patch
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgejo-backup
subjects:
- kind: ServiceAccount
  name: forgejo-backup
  namespace: forgejo
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-backup-recovery
spec:
  schedule: '*/5 * * * *'
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 420
      template:
        spec:
          serviceAccountName: forgejo-backup
          automountServiceAccountToken: true
          restartPolicy: Never
          terminationGracePeriodSeconds: 360
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: backup
            image: docker.io/library/python:3.14.5-slim@sha256:c845af9399020c7e562969a13689e929074a10fd057acd1b1fad06a2fb068e97
            command:
            - python3
            - /scripts/stage-forgejo.py
            - --recover
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
            env:
            - name: HOME
              value: /cache
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: temp
              mountPath: /tmp
          volumes:
          - name: script
            configMap:
              name: forgejo-backup-staging-script
          - name: cache
            emptyDir:
              sizeLimit: 6Gi
          - name: temp
            emptyDir:
              sizeLimit: 6Gi
