# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external/siderolabs/talos/config.schema.json
# Included in generated machine configs; apply changes without reboot.
# Requires a Talos image containing siderolabs/tailscale.
# Enrollment uses an interactive login; credentials persist under /var/lib/tailscale.
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: tailscale
environment:
  - TS_HOSTNAME=talos01
  - TS_USERSPACE=false
  - TS_ACCEPT_DNS=false
  - TS_AUTH_ONCE=true
  - TS_BOOT_TIMEOUT=15m
  - TS_ROUTES=192.168.1.10/32,192.168.1.20/32,192.168.1.21/32,fde2:b84e:c4cd:1::1000/128
  - TS_EXTRA_ARGS=--accept-routes=false --advertise-tags=tag:k8s-subnet-router
  - TS_TUN_DISABLE_UDP_GRO=true
