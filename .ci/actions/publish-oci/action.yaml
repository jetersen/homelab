# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
name: Publish Flux OCI
description: Validate and publish the committed Flux configuration
inputs:
  registry:
    description: Container registry hostname
    required: true
  repository:
    description: Owner and repository name
    required: true
runs:
  using: composite
  steps:
    - name: Package the committed manifests
      shell: bash
      run: |
        set -euo pipefail
        directory=$(mktemp -d "$RUNNER_TEMP/homelab-oci.XXXXXX")
        git archive HEAD kubernetes/apps kubernetes/cluster kubernetes/components kubernetes/flux \
          | tar -x -C "$directory"
        # Resolve remote bases in CI so Flux can build these overlays offline.
        for app in multus; do
          app_path="$directory/kubernetes/cluster/$app/app"
          kubectl kustomize "$app_path" > "$app_path/bundled.yaml"
          cat > "$app_path/kustomization.yaml" <<'EOF'
        apiVersion: kustomize.config.k8s.io/v1beta1
        kind: Kustomization
        resources:
          - bundled.yaml
        EOF
        done
        while IFS= read -r file; do
          kubectl kustomize "$(dirname "$file")" > /dev/null
        done < <(find "$directory/kubernetes/apps" "$directory/kubernetes/cluster" \
          "$directory/kubernetes/flux" -name kustomization.yaml | sort)
        echo "OCI_DIRECTORY=$directory" >> "$GITHUB_ENV"
    - name: Publish and verify the revision
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        revision=$(git rev-parse HEAD)
        package="$REGISTRY/${REPOSITORY,,}"
        flux push artifact "oci://$package/flux:sha-$revision" \
          --path="$OCI_DIRECTORY" \
          --source=https://github.com/jetersen/homelab \
          --revision="main@sha1:$revision" --reproducible
        verification=$(mktemp -d "$RUNNER_TEMP/homelab-verify.XXXXXX")
        flux pull artifact "oci://$package/flux:sha-$revision" --output="$verification"
        diff -qr "$OCI_DIRECTORY/kubernetes" "$verification/kubernetes"
        test "$(find "$verification" -mindepth 1 -maxdepth 1 -printf '%f\n')" = kubernetes
        # A newer unrelated commit does not get its own publish job.
        git fetch --no-tags --depth=1 origin refs/heads/main
        remote_revision=$(git rev-parse FETCH_HEAD)
        if ! git diff --quiet "$revision" "$remote_revision" -- \
          kubernetes \
          .ci/actions/publish-oci .ci/actions/setup-tool \
          .forgejo/workflows/publish-oci.yaml .github/workflows/publish-oci.yaml \
          infrastructure/forgejo/runner/Dockerfile \
          ':(exclude,glob)**/*.md' \
          ':(exclude,glob)kubernetes/talos/**' \
          ':(exclude,glob)**/test_*.py' \
          ':(exclude,glob)**/bootstrap*.fish' \
          ':(exclude,glob)kubernetes/cluster/grafana/app/dashboards/generate.py'; then
          echo 'Newer publication inputs exist; keeping revision tags without advancing main.'
          exit 0
        fi
        flux tag artifact "oci://$package/flux:sha-$revision" --tag=main
