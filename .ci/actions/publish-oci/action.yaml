name: Publish homelab OCI
description: Build workload images and publish the committed Flux configuration
inputs:
  registry:
    description: Container registry hostname
    required: true
  repository:
    description: Owner and repository name
    required: true
  username:
    description: Registry login user
    required: true
  token:
    description: Short-lived registry credential
    required: true
runs:
  using: composite
  steps:
    - name: Build and test the backup helper image
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        revision=$(git rev-parse HEAD)
        image="$REGISTRY/${REPOSITORY,,}/backup-helper"
        docker build -f infrastructure/backup/image/Dockerfile \
          --build-arg REVISION="$revision" \
          --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
          -t "$image:sha-$revision" .
        docker run --rm --network none --read-only --user 1000:1000 \
          --cap-drop ALL --security-opt no-new-privileges "$image:sha-$revision" --help
    - name: Build and test the runner job image
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        revision=$(git rev-parse HEAD)
        image="$REGISTRY/${REPOSITORY,,}/runner-job"
        docker build -f infrastructure/forgejo/runner/Dockerfile \
          --build-arg REVISION="$revision" \
          --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
          -t "$image:sha-$revision" .
        docker run --rm --network none --read-only --cap-drop ALL \
          --security-opt no-new-privileges "$image:sha-$revision" \
          bash -euc 'node --version; git --version; docker --version; docker buildx version; kubectl version --client; curl --version; jq --version'
    - name: Package the committed manifests
      shell: bash
      run: |
        set -euo pipefail
        directory=$(mktemp -d "$RUNNER_TEMP/homelab-oci.XXXXXX")
        git archive HEAD kubernetes/apps kubernetes/cluster kubernetes/components kubernetes/flux \
          | tar -x -C "$directory"
        while IFS= read -r file; do
          kubectl kustomize "$(dirname "$file")" > /dev/null
        done < <(find "$directory/kubernetes/apps" "$directory/kubernetes/cluster" \
          "$directory/kubernetes/flux" -name kustomization.yaml | sort)
        echo "OCI_DIRECTORY=$directory" >> "$GITHUB_ENV"
        echo "DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/homelab-auth.XXXXXX")" >> "$GITHUB_ENV"
    - name: Log in to the registry
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        USERNAME: ${{ inputs.username }}
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        printf '%s' "$TOKEN" | docker login "$REGISTRY" --username "$USERNAME" --password-stdin
    - name: Publish and verify the revision
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        revision=$(git rev-parse HEAD)
        package="$REGISTRY/${REPOSITORY,,}"
        docker push "$package/backup-helper:sha-$revision"
        docker push "$package/runner-job:sha-$revision"
        flux push artifact "oci://$package/flux:sha-$revision" \
          --path="$OCI_DIRECTORY" \
          --source=https://github.com/jetersen/homelab \
          --revision="main@sha1:$revision" --reproducible
        verification=$(mktemp -d "$RUNNER_TEMP/homelab-verify.XXXXXX")
        flux pull artifact "oci://$package/flux:sha-$revision" --output="$verification"
        diff -qr "$OCI_DIRECTORY/kubernetes" "$verification/kubernetes"
        test "$(find "$verification" -mindepth 1 -maxdepth 1 -printf '%f\n')" = kubernetes
        remote_revision=$(git ls-remote origin refs/heads/main | cut -f1)
        if [ "$remote_revision" != "$revision" ]; then
          echo 'A newer commit exists; keeping revision tags without advancing main.'
          exit 0
        fi
        docker tag "$package/backup-helper:sha-$revision" "$package/backup-helper:main"
        docker push "$package/backup-helper:main"
        docker tag "$package/runner-job:sha-$revision" "$package/runner-job:main"
        docker push "$package/runner-job:main"
        flux tag artifact "oci://$package/flux:sha-$revision" --tag=main
    - name: Remove registry credentials
      if: always()
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: |
        if [ -n "${DOCKER_CONFIG:-}" ]; then
          docker logout "$REGISTRY"
          rm -rf -- "$DOCKER_CONFIG"
        fi
