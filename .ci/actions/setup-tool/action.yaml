# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
name: Set up runner tool
description: Reuse the bundled tool or install the version pinned in the runner Dockerfile
inputs:
  tool:
    description: pulumi, flux, or git-cliff
    required: true
runs:
  using: composite
  steps:
    - id: bundled
      shell: bash
      env:
        TOOL: ${{ inputs.tool }}
      run: bash "$GITHUB_ACTION_PATH/check.sh"
    - uses: https://github.com/pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
      if: inputs.tool == 'pulumi' && steps.bundled.outputs.installed != 'true'
      with:
        pulumi-version: ${{ steps.bundled.outputs.version }}
    - uses: https://github.com/fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
      if: inputs.tool == 'flux' && steps.bundled.outputs.installed != 'true'
      with:
        version: ${{ steps.bundled.outputs.version }}
    - uses: https://github.com/taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
      if: inputs.tool == 'git-cliff' && steps.bundled.outputs.installed != 'true'
      with:
        tool: git-cliff@${{ steps.bundled.outputs.version }}
        fallback: none
