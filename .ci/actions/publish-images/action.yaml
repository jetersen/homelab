# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
name: Publish homelab images
description: Build, smoke test, and publish workload images
inputs:
  registry:
    description: Container registry hostname
    required: true
  repository:
    description: Owner and repository name
    required: true
runs:
  using: composite
  steps:
    - name: Publish the backup helper release
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REPOSITORY: ${{ inputs.repository }}
      run: bash .ci/publish-image.sh backup-helper
    - name: Publish the runner job release
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REPOSITORY: ${{ inputs.repository }}
      run: bash .ci/publish-image.sh runner-job
