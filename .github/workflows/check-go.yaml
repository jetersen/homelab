# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Go checks
on:
  push:
    branches: [main]
    paths:
      - infrastructure/backup/image/**
      - .github/workflows/check-go.yaml
      - .ci/actions/check-go/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-go
  cancel-in-progress: false
jobs:
  check:
    name: Go tests and vet
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: infrastructure/backup/image/go.mod
          cache-dependency-path: infrastructure/backup/image/go.sum
      - uses: ./.ci/actions/check-go
        with:
          directory: infrastructure/backup/image
