# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Publish container images
on:
  push:
    branches: [main]
    tags: ['backup-helper/v*']
    paths:
      - infrastructure/backup/image/**
      - infrastructure/forgejo/runner/Dockerfile
      - infrastructure/forgejo/runner/Dockerfile.dockerignore
      - .ci/actions/publish-images/**
      - .ci/backup-helper-cliff.toml
      - .ci/backup-helper-release.sh
      - .forgejo/workflows/publish-images.yaml
      - .github/workflows/publish-images.yaml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-images
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/backup-helper/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Mirror the backup helper release
        shell: bash
        env:
          RELEASE_AUTHORITY: github
        run: bash .ci/backup-helper-release.sh
      - uses: ./.ci/actions/publish-images
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
