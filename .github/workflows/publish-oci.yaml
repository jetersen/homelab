# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Publish Flux OCI
on:
  push:
    branches: [main]
    paths:
      - kubernetes/**
      - .ci/actions/publish-oci/**
      - .ci/actions/setup-tool/**
      - infrastructure/forgejo/runner/Dockerfile
      - .forgejo/workflows/publish-oci.yaml
      - .github/workflows/publish-oci.yaml
      - "!**/*.md"
      - "!kubernetes/talos/**"
      - "!**/test_*.py"
      - "!**/bootstrap*.fish"
      - "!kubernetes/cluster/grafana/app/dashboards/generate.py"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-oci
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          version: 2.9.5
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.ci/actions/publish-oci
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}
