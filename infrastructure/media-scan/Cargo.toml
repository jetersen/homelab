[package]
name = "media-scan"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Concurrent read-only native Matroska integrity and timestamp-gap scanning"
license = "ISC"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
matroska-demuxer = "0.8.1"
nix = { version = "0.31.3", features = ["signal", "process", "resource"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
