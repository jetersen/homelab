log:
  level: info
runner:
  capacity: 4
  timeout: 90m
  shutdown_timeout: 10m
  envs:
    DOCKER_HOST: tcp://docker:2375
  labels:
    - linux-docker:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.8.5@sha256:fa62e6623af06eb1de862ffe12114bf45e671c17c767e2a9b7f708ff5a9a7656
    - runner-rocket:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.8.5@sha256:fa62e6623af06eb1de862ffe12114bf45e671c17c767e2a9b7f708ff5a9a7656
cache:
  enabled: false
container:
  docker_host: tcp://docker:2375
  options: --add-host=docker:host-gateway --dns-option=ndots:1 --dns-search=.
  # Nix's bootstrap sandbox probe needs an unmasked /proc. Runner 13 loses the
  # empty mask lists from systempaths=unconfined while merging Docker options.
  privileged: true
  # Serialized Nix jobs retain their store and fetched inputs in Docker's
  # persistent data volume. Credentials stay in disposable job storage.
  valid_volumes:
    - dotfiles-nix-cache
    - /var/cache/nix-nas
  force_pull: true
