log:
  level: info
runner:
  capacity: 4
  timeout: 45m
  shutdown_timeout: 10m
  envs:
    DOCKER_HOST: tcp://docker:2375
  labels:
    - linux-docker:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.4.1@sha256:d0e384fcf0c301a758c568e0092bcdb20ace6fe0d4ea9749e6ddd72f2eeed95a
    - runner-rocket:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.4.1@sha256:d0e384fcf0c301a758c568e0092bcdb20ace6fe0d4ea9749e6ddd72f2eeed95a
cache:
  enabled: false
container:
  docker_host: tcp://docker:2375
  options: --add-host=docker:host-gateway --dns-option=ndots:1 --dns-search=.
  privileged: false
  # Serialized Nix jobs retain their store and fetched inputs in Docker's
  # persistent data volume. Credentials stay in disposable job storage.
  valid_volumes:
    - dotfiles-nix-cache
    - /var/cache/nix-nas
  force_pull: true
