log:
  level: info
runner:
  capacity: 4
  timeout: 45m
  shutdown_timeout: 10m
  envs:
    DOCKER_HOST: tcp://docker:2375
  labels:
    - linux-docker:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.4.0@sha256:b37fa670d98a1dcaa6d7593da076658210ce5fad9f1a6eb97e2dbf105835aa41
    - runner-rocket:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.4.0@sha256:b37fa670d98a1dcaa6d7593da076658210ce5fad9f1a6eb97e2dbf105835aa41
cache:
  enabled: false
container:
  docker_host: tcp://docker:2375
  options: --add-host=docker:host-gateway --dns-option=ndots:1 --dns-search=.
  privileged: false
  # Serialized Nix jobs retain their store and fetched inputs in Docker's
  # persistent data volume. Credentials stay in disposable job storage.
  valid_volumes:
    - dotfiles-nix-cache
    - /var/cache/nix-nas
  force_pull: true
