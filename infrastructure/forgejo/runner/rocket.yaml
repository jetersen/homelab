log:
  level: info
runner:
  capacity: 4
  timeout: 45m
  shutdown_timeout: 10m
  envs:
    DOCKER_HOST: tcp://docker:2375
  labels:
    - linux-docker:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.7.0@sha256:bf1f2c8190a86eb5126985b01652a7d65004669c8fee772bd6d010393cc73199
    - runner-rocket:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.7.0@sha256:bf1f2c8190a86eb5126985b01652a7d65004669c8fee772bd6d010393cc73199
cache:
  enabled: false
container:
  docker_host: tcp://docker:2375
  options: --add-host=docker:host-gateway --dns-option=ndots:1 --dns-search=.
  privileged: false
  # Serialized Nix jobs retain their store and fetched inputs in Docker's
  # persistent data volume. Credentials stay in disposable job storage.
  valid_volumes:
    - dotfiles-nix-cache
    - /var/cache/nix-nas
  force_pull: true
