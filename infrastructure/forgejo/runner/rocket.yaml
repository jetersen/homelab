log:
  level: info
runner:
  capacity: 4
  timeout: 45m
  shutdown_timeout: 10m
  envs:
    DOCKER_HOST: tcp://docker:2375
  labels:
    - linux-docker:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.8.0@sha256:a6a8fdf9a7b4914434835fbd3763da496f27797c160123d7386af8cfb711aff9
    - runner-rocket:docker://forgejo.jetersen.dev/jetersen/homelab/runner-job:1.8.0@sha256:a6a8fdf9a7b4914434835fbd3763da496f27797c160123d7386af8cfb711aff9
cache:
  enabled: false
container:
  docker_host: tcp://docker:2375
  options: --add-host=docker:host-gateway --dns-option=ndots:1 --dns-search=.
  privileged: false
  # Serialized Nix jobs retain their store and fetched inputs in Docker's
  # persistent data volume. Credentials stay in disposable job storage.
  valid_volumes:
    - dotfiles-nix-cache
    - /var/cache/nix-nas
  force_pull: true
