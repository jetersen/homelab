# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
name: homelab-forgejo-runner
services:
  docker:
    image: docker.io/library/docker:29.9.1-dind@sha256:3e5756e2b6dad6a5f1f5deacf0a19f9eaa2581b76ae092b2d4a118162e1d4d4e
    privileged: true
    # Keep nested jobs inside this service's aggregate memory limit.
    cgroup: private
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ''
    command: [--tls=false, --storage-driver=overlay2, --dns=100.100.100.100, --dns=192.168.1.21, --dns=192.168.1.2]
    volumes:
      - docker-cache:/var/lib/docker
      - nix-nas-cache:/var/cache/nix-nas
    healthcheck:
      test: [CMD, docker, info]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 16g
    memswap_limit: 24g
  runner:
    image: data.forgejo.org/forgejo/runner:13@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552
    restart: unless-stopped
    depends_on:
      docker:
        condition: service_healthy
    user: '1000:1000'
    working_dir: /data
    entrypoint: [/bin/sh, -ec]
    command:
      - exec forgejo-runner --config /config/runner.yaml daemon --url https://forgejo.jetersen.dev --uuid "$$(cat /registration/uuid)" --token-url file:/registration/token
    volumes:
      - ./rocket.yaml:/config/runner.yaml:ro
      - ${RUNNER_REGISTRATION_DIR:?Set a private runner registration directory}:/registration:ro
      - runner-data:/data
    mem_limit: 512m
volumes:
  nix-nas-cache:
    driver: local
    driver_opts:
      type: nfs
      o: addr=truenas.lan.jetersen.dev,nfsvers=4,rw
      device: :/mnt/nvme/nix-cache
  docker-cache:
  runner-data:
