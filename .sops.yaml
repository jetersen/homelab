creation_rules:
  # Kubernetes Secret manifests: encrypt only the payload, so kustomize and Flux
  # can still read apiVersion/kind/metadata.
  - path_regex: kubernetes/(apps|cluster)/.*\.sops\.yaml
    encrypted_regex: ^(data|stringData)$
    age: >-
      age1u0m8ryqg7hfhuykraxe35v4xzw92a03w9jpt75yv3m57g6pvpp0sf24mdy
  - path_regex: .*.sops.yaml
    age: >-
      age1u0m8ryqg7hfhuykraxe35v4xzw92a03w9jpt75yv3m57g6pvpp0sf24mdy
